name: Release

# Fork 的轻量发布流水线：打 tag（v*）即自动交叉编译并发布 GitHub Release。
# 不依赖 GoReleaser / Docker Hub secrets。

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,  goarch: amd64, ext: '',     archive: tar.gz }
          - { goos: linux,  goarch: arm64, ext: '',     archive: tar.gz }
          - { goos: linux,  goarch: arm,   goarm: '7',  ext: '', archive: tar.gz }
          - { goos: linux,  goarch: arm,   goarm: '6',  ext: '', archive: tar.gz }
          - { goos: linux,  goarch: arm,   goarm: '5',  ext: '', archive: tar.gz }
          - { goos: linux,  goarch: '386', ext: '',     archive: tar.gz }
          - { goos: darwin, goarch: amd64, ext: '',     archive: tar.gz }
          - { goos: darwin, goarch: arm64, ext: '',     archive: tar.gz }
          - { goos: windows, goarch: amd64, ext: '.exe', archive: zip }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test ./...

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: 0
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          go build -trimpath \
            -ldflags "-s -w -X 'main.version=${GITHUB_REF_NAME}'" \
            -o "out/dnet${{ matrix.ext }}" .
          # 资产名必须与 D-NET 自带更新器和 luci-app-dnet 的 arch 约定一致：
          # amd64 → x86_64，386 → i386，arm → armv5/6/7。
          case "${GOARCH}" in
            amd64) ARCH=x86_64 ;;
            386)   ARCH=i386 ;;
            arm)   ARCH="armv${GOARM}" ;;
            *)     ARCH="${GOARCH}" ;;
          esac
          NAME="dnet_${VERSION}_${GOOS}_${ARCH}"
          mkdir -p "dist/${NAME}"
          cp "out/dnet${{ matrix.ext }}" "dist/${NAME}/"
          cp README.md LICENSE "dist/${NAME}/" 2>/dev/null || true
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            zip -qr "${NAME}.zip" "${NAME}"
          else
            tar -czf "${NAME}.tar.gz" "${NAME}"
          fi
          cd ..
          sha256sum "dist/${NAME}.${{ matrix.archive }}" > "dist/${NAME}.${{ matrix.archive }}.sha256"
          echo "ASSET=dist/${NAME}.${{ matrix.archive }}" >> "$GITHUB_OUTPUT"
          echo "CHECKSUM=dist/${NAME}.${{ matrix.archive }}.sha256" >> "$GITHUB_OUTPUT"
        id: build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: asset-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goarm && format('v{0}', matrix.goarm) || '' }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          retention-days: 3

  release:
    name: Publish release
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all assets
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Generate checksums.txt
        run: |
          cd dist
          # D-NET 的 -u 与 luci-app-dnet 都要求一个 checksums.txt（sha256sum 两空格格式）。
          sha256sum -- *.tar.gz *.zip > checksums.txt
          cat checksums.txt

      - name: Generate release notes
        run: |
          # 只写本次 tag 相对上一个 tag 的增量。历史修改清单已经在旧 Release 里，
          # 不再每次整份复制，避免说明内容互相重复。
          PREV=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          {
            echo "## 本次更新"
            echo
            if [ -n "$PREV" ]; then
              git log --oneline --no-decorate "${PREV}..${GITHUB_REF_NAME}"
              echo
              echo "**Full Changelog**: https://github.com/KingNuoNuo/dnet/compare/${PREV}...${GITHUB_REF_NAME}"
            else
              echo "首个 Release。"
              git log --oneline --no-decorate "${GITHUB_REF_NAME}" | head -60
            fi
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: D-NET ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
            dist/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
