<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1"
    />
    <title>DPF 配置 - 端口转发</title>
    <link rel="stylesheet" href="/static/css/layui.css" />
    <link rel="stylesheet" href="/static/css/common.css" />
    <link rel="stylesheet" href="/static/css/logs.css" />
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon" />
    <script src="/static/layui.js"></script>
    <style>
      body {
        margin: 0;
        padding: 0 0 25px;
        overflow-x: hidden;
        min-height: 100vh;
      }
      html {
        overflow-x: hidden;
      }
      #dirty {
        color: #c98b1d;
      }
      #dirty:empty {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="layui-container">
      <p class="page-desc">
        端口转发 —— 把公网入站端口映射到内网主机与服务。
      </p>

      <div class="dnet-stat" id="stat">
        <span class="s-tag">运行指标</span>
        <div class="s-kpi">
          <div class="kpi">
            <span class="k">规则总数</span>
            <span class="v" id="kpi-total">—</span>
          </div>
          <div class="kpi">
            <span class="k">连通性</span>
            <span class="v" id="kpi-conn">—</span>
          </div>
          <div class="kpi">
            <span class="k">活跃连接</span>
            <span class="v" id="kpi-live">—</span>
          </div>
        </div>
        <div class="s-act">
          <button type="button" class="layui-btn layui-btn-primary" id="reload">
            重载规则
          </button>
        </div>
      </div>

      <form class="layui-form" lay-filter="forward-form" onsubmit="return false">
        <div class="layui-card">
          <div class="layui-card-body">
            <div class="dnet-group">
              <span class="t">全局</span>
            </div>
            <div class="layui-form-item">
              <label class="layui-form-label" for="dpf_enable"
                >是否开启：</label
              >
              <div class="layui-input-inline">
                <input
                  type="checkbox"
                  id="dpf_enable"
                  name="dpf_enable"
                  lay-filter="dpf-enable"
                  lay-skin="switch"
                  lay-text="开启|关闭"
                />
              </div>
              <div class="layui-form-mid layui-word-aux">
                全局开关，关闭后 DPF
                将停用，所有规则停止转发，配置保留。保存后生效。
              </div>
            </div>

            <div class="dnet-group">
              <span class="t">规则列表</span>
              <span class="act">
                <button
                  type="button"
                  class="layui-btn layui-btn-primary"
                  id="probe-all"
                >
                  全部检测
                </button>
              </span>
            </div>

            <div class="dnet-rules-scroll">
              <div class="dnet-rules">
                <div class="dnet-rules-head">
                  <span></span>
                  <span>监听协议</span>
                  <span>监听端口</span>
                  <span>目标地址</span>
                  <span>目标端口</span>
                  <span>连通性</span>
                  <span>流量</span>
                  <span>备注</span>
                  <span></span>
                </div>
                <div class="dnet-rules-list" id="rows"></div>
              </div>
            </div>

            <button type="button" class="dnet-rule-add" id="add-row">
              + 添加一行
            </button>
            <p class="dnet-rules-hint">
              监听协议决定入站放行方式。连通性由本页每 5
              分钟自动探测，也可点「全部检测」立即重测；鼠标悬停可看失败原因。UDP
              无握手，通用探测无法判断，请用实际客户端请求后看会话与流量。
            </p>
          </div>

          <div class="dnet-card-foot">
            <span class="note">改动将在保存后立即生效<span id="dirty"></span></span>
            <button type="button" class="layui-btn layui-btn-primary reset">
              复位
            </button>
            <button
              type="submit"
              class="layui-btn save"
              lay-submit
              lay-filter="save"
            >
              保存并应用
            </button>
          </div>
        </div>
      </form>
    </div>

    <script>
      layui.use(["form", "layer"], function () {
        const form = layui.form,
          layer = layui.layer;
        const root = document.querySelector("#rows"),
          stat = document.querySelector("#stat");

        let rules = [],
          enabled = false,
          selectedID = "",
          saved = null,
          live = null,
          dirty = false,
          busy = false,
          loaded = false,
          probing = false;
        const probes = new Map(); // id -> {state, meta, tip}
        const expanded = new Set(); // 展开了高级设置的行 id

        const NETWORKS = [
          ["tcp4", "TCP / IPv4"],
          ["tcp6", "TCP / IPv6"],
          ["udp4", "UDP / IPv4"],
          ["udp6", "UDP / IPv6"],
        ];
        const ICON_CHEV =
          '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 2.5L8 6l-3.5 3.5"/></svg>';
        const ICON_OK =
          '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.2 6.4l2.5 2.5 5.1-5.6"/></svg>';
        const ICON_CROSS =
          '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M3 3l6 6M9 3l-6 6"/></svg>';
        const ICON_DASH =
          '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M3 6h6"/></svg>';

        const clone = (value) => JSON.parse(JSON.stringify(value));
        const esc = (value) =>
          String(value ?? "").replace(
            /[&<>"']/g,
            (c) =>
              ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;",
              })[c],
          );
        const num = (value) => (Number.isFinite(value) ? value : "");

        function rowEl(id) {
          return Array.from(root.children).find((el) => el.dataset.id === id);
        }
        function current() {
          return rules.find((r) => r.id === selectedID);
        }
        function markDirty() {
          dirty = true;
          document.querySelector("#dirty").textContent = "（有未提交的更改）";
        }
        function error(e) {
          const text = document.createElement("span");
          text.textContent = e.message || String(e);
          layer.msg(text.outerHTML, { icon: 2, time: 2500 });
        }
        function confirmBox(text, title) {
          return new Promise((resolve) => {
            layer.confirm(
              text,
              { title },
              (index) => {
                layer.close(index);
                resolve(true);
              },
              () => resolve(false),
            );
          });
        }
        async function api(body, url = "/api/forward") {
          const response = await fetch(url, {
            method: body ? "POST" : "GET",
            headers: body ? { "Content-Type": "application/json" } : {},
            body: body ? JSON.stringify(body) : undefined,
          });
          if (!response.ok) throw Error("请求失败：" + response.status);
          let result;
          try {
            result = await response.json();
          } catch {
            throw Error("请检查登录状态并刷新页面");
          }
          if (!result.status) throw Error(result.msg);
          return result.data;
        }

        /* ---------------- 数据结构 ---------------- */
        function newRule() {
          const bytes = new Uint8Array(16);
          crypto.getRandomValues(bytes);
          let port = 8080;
          while (rules.some((r) => r.listen_port === port) && port < 65535) port++;
          const sequence =
            Math.max(0, ...rules.map((r) => r.sequence || 0)) + 1;
          return {
            id: Array.from(bytes, (x) => x.toString(16).padStart(2, "0")).join(
              "",
            ),
            sequence,
            name: "规则 " + sequence,
            enabled: true,
            network: "tcp4",
            listen_address: "0.0.0.0",
            listen_port: port,
            target_host: "",
            target_port: 80,
            dial_timeout_sec: 10,
            idle_timeout_sec: 0,
            max_connections: 100,
            allow_cidrs: [],
          };
        }

        function ipVersion(value) {
          if (
            /^(?:[0-9]{1,3}\.){3}[0-9]{1,3}$/.test(value) &&
            value
              .split(".")
              .every(
                (part) => String(Number(part)) === part && Number(part) <= 255,
              )
          )
            return 4;
          if (!value.includes(":") || !/^[0-9a-f:.]+$/i.test(value)) return 0;
          try {
            new URL(`http://[${value}]/`);
            return 6;
          } catch {
            return 0;
          }
        }
        function validHost(value) {
          if (ipVersion(value)) return true;
          if (!value || value.length > 253 || /^[0-9.]+$/.test(value))
            return false;
          return value
            .replace(/\.$/, "")
            .split(".")
            .every((part) =>
              /^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$/i.test(part),
            );
        }
        function connLabel(rule) {
          return rule.network.startsWith("udp") ? "最大会话数" : "最大连接数";
        }
        function ruleError(rule) {
          if (!["tcp4", "tcp6", "udp4", "udp6"].includes(rule.network))
            return ["network", "请选择监听协议"];
          if (
            ipVersion(rule.listen_address) !==
            (rule.network.endsWith("4") ? 4 : 6)
          )
            return [
              "listen_address",
              "请填写与监听协议匹配的 IPv4 / IPv6 监听 IP",
            ];
          for (const [key, min, max, label] of [
            ["listen_port", 1, 65535, "监听端口"],
            ["target_port", 1, 65535, "目标端口"],
            ["dial_timeout_sec", 1, 300, "拨号超时"],
            ["idle_timeout_sec", 0, 86400, "空闲超时"],
            ["max_connections", 1, 10000, connLabel(rule)],
          ]) {
            if (
              !Number.isInteger(rule[key]) ||
              rule[key] < min ||
              rule[key] > max
            )
              return [key, `${label}必须为 ${min}–${max} 的整数`];
          }
          if (!validHost(rule.target_host))
            return [
              "target_host",
              "请填写有效 IP 或域名，不要包含协议、路径或端口",
            ];
          if (
            rule.listen_address === rule.target_host &&
            rule.listen_port === rule.target_port
          )
            return ["target_host", "目标不能与监听入口相同"];
          for (const entry of rule.allow_cidrs || []) {
            const parts = entry.split("/");
            const version = ipVersion(parts[0]);
            if (
              !version ||
              parts.length > 2 ||
              (parts.length === 2 &&
                (!/^\d+$/.test(parts[1]) ||
                  Number(parts[1]) > (version === 4 ? 32 : 128)))
            )
              return ["allow_cidrs", `无效的白名单 IP / CIDR：${entry}`];
          }
          if (
            rules.some(
              (other) =>
                other.id !== rule.id &&
                other.network === rule.network &&
                other.listen_address === rule.listen_address &&
                other.listen_port === rule.listen_port,
            )
          )
            return ["listen_port", "监听地址和端口与其他规则重复"];
          return null;
        }
        function probeOf(id) {
          return probes.get(id);
        }
        function connCell(id) {
          const p = probeOf(id);
          if (!p)
            return '<span class="dnet-conn" title="尚未检测"><span class="meta">—</span></span>';
          if (p.state === "ok")
            return `<span class="dnet-conn ok" title="${esc(p.tip)}">${ICON_OK}<span>连通</span><span class="meta">${esc(p.meta)}</span></span>`;
          if (p.state === "fail")
            return `<span class="dnet-conn fail" title="${esc(p.tip)}">${ICON_CROSS}<span>不通</span><span class="meta">${esc(p.meta)}</span></span>`;
          if (p.state === "pending")
            return `<span class="dnet-conn"><span class="meta">检测中…</span></span>`;
          return `<span class="dnet-conn" title="${esc(p.tip)}">${ICON_DASH}<span class="meta">${esc(p.meta || "不可探测")}</span></span>`;
        }

        /* ---------------- 渲染 ---------------- */
        function rowNode(rule) {
          const el = document.createElement("div");
          el.className = "dnet-rule";
          el.dataset.id = rule.id;
          el.classList.toggle("is-current", rule.id === selectedID);
          const open = expanded.has(rule.id);
          el.innerHTML = `
            <div class="dnet-rule-main">
              <button type="button" class="dnet-rule-exp" aria-expanded="${open}" aria-label="展开高级设置" title="高级设置">${ICON_CHEV}</button>
              <select data-key="network" aria-label="监听协议" lay-ignore>${NETWORKS.map(
                ([value, text]) =>
                  `<option value="${value}"${
                    value === rule.network ? " selected" : ""
                  }>${text}</option>`,
              ).join("")}</select>
              <input data-key="listen_port" type="number" min="1" max="65535" inputmode="numeric" aria-label="监听端口" placeholder="8080" value="${esc(num(rule.listen_port))}">
              <input data-key="target_host" aria-label="目标地址" placeholder="192.168.1.10" value="${esc(rule.target_host)}">
              <input data-key="target_port" type="number" min="1" max="65535" inputmode="numeric" aria-label="目标端口" placeholder="80" value="${esc(num(rule.target_port))}">
              <span class="dnet-conn-cell">${connCell(rule.id)}</span>
              <span class="dnet-traffic-cell" aria-label="流量统计">${trafficCell(rule.id)}</span>
              <input data-key="name" aria-label="备注" placeholder="NAS 面板" value="${esc(rule.name)}">
              <button type="button" class="dnet-rule-del" aria-label="删除该行" title="删除该行">${ICON_CROSS}</button>
            </div>
            <div class="dnet-rule-adv"${open ? "" : " hidden"}>
              <div class="f">
                <label>监听 IP</label>
                <input data-key="listen_address" aria-label="监听 IP" placeholder="0.0.0.0 或 ::" value="${esc(rule.listen_address)}">
              </div>
              <div class="f">
                <label>拨号超时（秒）</label>
                <input data-key="dial_timeout_sec" type="number" min="1" max="300" inputmode="numeric" aria-label="拨号超时" value="${esc(num(rule.dial_timeout_sec))}">
              </div>
              <div class="f">
                <label>空闲超时（秒）</label>
                <input data-key="idle_timeout_sec" type="number" min="0" max="86400" inputmode="numeric" aria-label="空闲超时" value="${esc(num(rule.idle_timeout_sec))}">
              </div>
              <div class="f">
                <label data-net-label>${connLabel(rule)}</label>
                <input data-key="max_connections" type="number" min="1" max="10000" inputmode="numeric" aria-label="${connLabel(rule)}" value="${esc(num(rule.max_connections))}">
              </div>
              <div class="f wide">
                <label>来源白名单</label>
                <input data-key="allow_cidrs" aria-label="来源白名单" placeholder="192.168.1.0/24, 2001:db8::/32" value="${esc((rule.allow_cidrs || []).join(", "))}">
              </div>
              <p class="note">
                监听 IP：IPv4 用 0.0.0.0、IPv6 用 :: 表示监听全部接口，必须与上面的监听协议同族。空闲超时填 0 时，TCP 不限、UDP 用 60 秒会话超时。来源白名单填 IP / CIDR，逗号分隔，留空允许所有来源。
              </p>
              <div class="f wide">
                <span></span>
                <button type="button" class="layui-btn layui-btn-primary layui-btn-sm" data-probe>测试目标</button>
              </div>
            </div>`;
          return el;
        }

        function renderRows() {
          expanded.clear();
          root.replaceChildren(...rules.map(rowNode));
        }
        function renderAll() {
          document.querySelector("#dpf_enable").checked = enabled;
          renderRows();
          renderStat();
          document.querySelector("#dirty").textContent = dirty
            ? "（有未提交的更改）"
            : "";
          controls(busy || !loaded);
        }
        function markCurrent() {
          for (const el of root.children)
            el.classList.toggle("is-current", el.dataset.id === selectedID);
        }
        function refreshConn(id) {
          const cell = rowEl(id)?.querySelector(".dnet-conn-cell");
          if (cell) cell.innerHTML = connCell(id);
        }
        /* 每条规则的流量计数来自转发进程的内存计数器（接口按规则 id 分别返回）。
           进程重启后从零开始 —— 这是「自本次启动以来」的量，不是历史累计。 */
        function statusOf(id) {
          return ((live && live.status) || []).find((x) => x.id === id);
        }
        function trafficCell(id) {
          const s = statusOf(id);
          if (!s) return '<span class="dnet-traffic dim">—</span>';
          return (
            '<span class="dnet-traffic" title="自上次启动以来的转发量">' +
            `<b>${bytes(s.upload || 0)}</b> 入 · <b>${bytes(s.download || 0)}</b> 出` +
            "</span>"
          );
        }
        function updateTraffic() {
          for (const el of root.children) {
            const cell = el.querySelector(".dnet-traffic-cell");
            if (cell) cell.innerHTML = trafficCell(el.dataset.id);
          }
        }
        function syncNetLabel(id) {
          const rule = rules.find((r) => r.id === id);
          const label = rowEl(id)?.querySelector("[data-net-label]");
          if (!rule || !label) return;
          label.textContent = connLabel(rule);
        }
        function bytes(value) {
          if (!value) return "0 B";
          const units = ["B", "KB", "MB", "GB", "TB"];
          let n = value,
            i = 0;
          while (n >= 1024 && i < units.length - 1) {
            n /= 1024;
            i++;
          }
          return (
            (i === 0 ? String(n) : n.toFixed(n < 10 ? 2 : 1)) + " " + units[i]
          );
        }
        function renderStat() {
          document.querySelector("#kpi-total").textContent = rules.length + " 条";

          // 分母只算可探测的规则：UDP 没有握手，通用探测给不出结论，
          // 把它计进去会让「1 / 3 正常」看着像两条坏了。
          const probeable = rules.filter((r) => !r.network.startsWith("udp"));
          const states = probeable.map((r) => probeOf(r.id)).filter(Boolean);
          const ok = states.filter((x) => x.state === "ok").length;
          const fail = states.filter((x) => x.state === "fail").length;
          const conn = document.querySelector("#kpi-conn");
          conn.className = "v";
          if (!probeable.length) conn.textContent = "—";
          else {
            conn.textContent = `${ok} / ${probeable.length} 正常`;
            if (fail) conn.classList.add("warn");
            else if (ok) conn.classList.add("ok");
          }

          const status = (live && live.status) || [];
          const active = status.reduce((sum, x) => sum + (x.connections || 0), 0);
          document.querySelector("#kpi-live").textContent = live
            ? String(active)
            : "—";
          updateTraffic();

          stat.classList.toggle("is-off", !enabled);
          stat.classList.toggle("is-warn", enabled && fail > 0);
        }
        function controls(disabled) {
          for (const node of document.querySelectorAll("button,input,select"))
            if (node.id !== "probe-all") node.disabled = disabled;
          document.querySelector("#probe-all").disabled = disabled || probing;
          form.render("checkbox");
        }

        /* ---------------- 连通性探测 ---------------- */
        async function probe(id) {
          const rule = rules.find((r) => r.id === id);
          if (!rule) return;
          if (rule.network.startsWith("udp")) {
            probes.set(id, {
              state: "na",
              meta: "不可探测",
              tip: "UDP 无握手，通用探测无法判断目标是否可用。请用实际客户端发起请求，再看会话、收发流量与规则日志。",
            });
            refreshConn(id);
            return;
          }
          if (ruleError(rule)) {
            probes.set(id, {
              state: "na",
              meta: "待补全",
              tip: "该行还有未填或无效的必填项，补全后即可检测。",
            });
            refreshConn(id);
            return;
          }
          probes.set(id, { state: "pending", meta: "" });
          refreshConn(id);
          try {
            const result = await api(rule, "/api/forward/probe");
            probes.set(id, {
              state: "ok",
              meta: result.elapsed_ms + " ms",
              tip: `TCP 握手成功，耗时 ${result.elapsed_ms} ms。仅确认端口可连接，不代表应用或证书正常。`,
            });
          } catch (e) {
            const message = e.message || String(e);
            probes.set(id, {
              state: "fail",
              meta: /refused|拒绝/i.test(message)
                ? "拒绝"
                : /timeout|timed out|超时/i.test(message)
                  ? "超时"
                  : /no route|不可达/i.test(message)
                    ? "不可达"
                    : "失败",
              tip: message,
            });
          }
          refreshConn(id);
          renderStat();
        }
        async function probeAll(manual) {
          if (probing || !loaded) return;
          probing = true;
          const button = document.querySelector("#probe-all");
          button.disabled = true;
          button.textContent = "检测中…";
          const queue = rules.map((r) => r.id);
          await Promise.all(
            Array.from({ length: Math.min(4, queue.length) }, async () => {
              while (queue.length) await probe(queue.shift());
            }),
          );
          probing = false;
          button.textContent = "全部检测";
          button.disabled = busy || !loaded;
          renderStat();
          if (manual) layer.msg("连通性检测完成", { icon: 1, time: 1200 });
        }

        /* ---------------- 交互 ---------------- */
        function readField(input) {
          const row = input.closest(".dnet-rule");
          const rule = row && rules.find((r) => r.id === row.dataset.id);
          if (!rule) return;
          const key = input.dataset.key;
          if (input.type === "number")
            rule[key] = input.value === "" ? NaN : Number(input.value);
          else if (key === "allow_cidrs")
            rule[key] = input.value
              .split(",")
              .map((x) => x.trim())
              .filter(Boolean);
          else rule[key] = input.value;
          markDirty();
        }
        function addRow() {
          if (!loaded || busy) return;
          if (rules.length >= 128) {
            error(Error("最多支持 128 条规则"));
            return;
          }
          const rule = newRule();
          rules.push(rule);
          selectedID = rule.id;
          markDirty();
          renderRows();
          renderStat();
          const el = rowEl(rule.id);
          if (el) {
            el.scrollIntoView({ block: "nearest", behavior: "smooth" });
            el.querySelector('[data-key="target_host"]')?.focus({
              preventScroll: true,
            });
          }
        }
        async function removeRow(rule) {
          if (!loaded || busy) return;
          if (rules.length <= 1) {
            layer.msg("至少保留一行，可关闭全局开关停用");
            return;
          }
          const confirmed = await confirmBox(
            `确定删除「${rule.name || "未命名"}」？保存后生效，并断开它已有的连接。`,
            "删除规则",
          );
          if (!confirmed) return;
          const index = rules.findIndex((r) => r.id === rule.id);
          rules.splice(index, 1);
          if (selectedID === rule.id)
            selectedID = rules[Math.min(index, rules.length - 1)].id;
          probes.delete(rule.id);
          markDirty();
          renderRows();
          renderStat();
        }
        async function reload() {
          if (busy || !loaded) return;
          if (dirty) {
            const confirmed = await confirmBox(
              "放弃所有未提交的更改，从服务端重新载入配置？",
              "重载规则",
            );
            if (!confirmed) return;
          }
          try {
            const data = await api();
            saved = clone(data);
            live = data;
            restore(data);
            layer.msg("已重载", { icon: 1, time: 1000 });
            probeAll(false);
          } catch (e) {
            error(e);
          }
        }
        function restore(data) {
          enabled = data.enabled;
          rules = clone(data.rules || []);
          // Preserve numbering independently of display names and internal IDs.
          const used = new Set(
            rules.map((rule) => rule.sequence).filter(Boolean),
          );
          for (const rule of rules) {
            if (!rule.sequence) {
              let sequence = 1;
              while (used.has(sequence)) sequence++;
              rule.sequence = sequence;
              used.add(sequence);
            }
            if (!rule.name) rule.name = "规则 " + rule.sequence;
          }
          if (!rules.length) rules.push(newRule());
          if (!rules.some((r) => r.id === selectedID)) selectedID = rules[0].id;
          probes.clear();
          dirty = false;
          renderAll();
        }
        async function submit() {
          if (busy || !loaded) return;
          for (const rule of rules) {
            const issue = ruleError(rule);
            if (!issue) continue;
            selectedID = rule.id;
            markCurrent();
            const el = rowEl(rule.id);
            if (el) {
              el.scrollIntoView({ block: "center", behavior: "smooth" });
              const field = el.querySelector(`[data-key="${issue[0]}"]`);
              if (field) {
                const adv = field.closest(".dnet-rule-adv");
                if (adv && adv.hidden) {
                  adv.hidden = false;
                  el.querySelector(".dnet-rule-exp")?.setAttribute(
                    "aria-expanded",
                    "true",
                  );
                  expanded.add(rule.id);
                }
                field.focus({ preventScroll: true });
              }
            }
            layer.msg(`${rule.name || "未命名"}：${issue[1]}`, {
              icon: 2,
              time: 3000,
            });
            return;
          }
          busy = true;
          controls(true);
          try {
            const data = await api({
              enabled,
              rules: rules.map((rule) => ({ ...rule, enabled: true })),
            });
            // 保存接口万一只回一句 msg、不带 data，别拿 undefined 去覆盖本地状态
            // （clone(undefined) 会抛「"undefined" is not valid JSON」）
            if (!data) {
              dirty = false;
              document.querySelector("#dirty").textContent = "";
              layer.msg("配置保存并应用成功", { icon: 1, time: 1200 });
              return;
            }
            saved = clone(data);
            live = data;
            restore(data);
            layer.msg("配置保存并应用成功", { icon: 1, time: 1200 });
            probeAll(false);
          } catch (e) {
            error(e);
          } finally {
            busy = false;
            controls(false);
          }
        }
        async function reset() {
          if (!saved || busy) return;
          if (!dirty) {
            restore(saved);
            return;
          }
          const confirmed = await confirmBox(
            "放弃所有未提交的更改，恢复到上次提交状态？",
            "重置配置",
          );
          if (confirmed) restore(saved);
        }

        root.addEventListener("input", (e) => {
          if (e.target.dataset.key) readField(e.target);
        });
        root.addEventListener("change", (e) => {
          const key = e.target.dataset.key;
          if (!key) return;
          readField(e.target);
          if (key === "network") syncNetLabel(e.target.closest(".dnet-rule").dataset.id);
        });
        root.addEventListener("click", (e) => {
          const row = e.target.closest(".dnet-rule");
          if (!row) return;
          if (e.target.closest(".dnet-rule-exp")) {
            const adv = row.querySelector(".dnet-rule-adv");
            const open = adv.hidden;
            adv.hidden = !open;
            row
              .querySelector(".dnet-rule-exp")
              .setAttribute("aria-expanded", String(open));
            if (open) expanded.add(row.dataset.id);
            else expanded.delete(row.dataset.id);
            return;
          }
          if (e.target.closest(".dnet-rule-del")) {
            const rule = rules.find((r) => r.id === row.dataset.id);
            if (rule) removeRow(rule);
            return;
          }
          if (e.target.closest("[data-probe]")) {
            const rule = rules.find((r) => r.id === row.dataset.id);
            if (!rule || busy) return;
            const issue = ruleError(rule);
            if (issue) {
              layer.msg(`${rule.name || "未命名"}：${issue[1]}`, {
                icon: 2,
                time: 2500,
              });
              return;
            }
            const button = e.target.closest("[data-probe]");            button.disabled = true;
            button.textContent = "测试中…";
            api(clone(rule), "/api/forward/probe")
              .then((result) => {
                const content = document.createElement("p");
                content.style.padding = "16px";
                content.textContent = `${rule.name || "未命名"}：TCP 连接成功，耗时 ${result.elapsed_ms} ms。仅确认端口可连接，不代表应用或证书正常。`;
                layer.open({
                  title: "目标测试结果",
                  content: content.outerHTML,
                  area: "420px",
                });
              })
              .catch(error)
              .finally(() => {
                button.disabled = busy || !loaded;
                button.textContent = "测试目标";
              });
            return;
          }
          // 点行的空白处＝选中该行（原「配置」下拉的职责，那栏已移除）。
          // 输入框、按钮、展开箭头有自己的语义，别抢。
          if (e.target.closest("button, input, select, label")) return;
          selectedID = row.dataset.id;
          markCurrent();
        });

        document.querySelector("#add-row").onclick = addRow;
        document.querySelector("#probe-all").onclick = () => probeAll(true);
        document.querySelector("#reload").onclick = reload;
        for (const button of document.querySelectorAll(".reset"))
          button.onclick = reset;

        form.on("submit(save)", function () {
          submit();
          return false;
        });
        form.on("switch(dpf-enable)", (data) => {
          enabled = data.elem.checked;
          markDirty();
          renderStat();
        });
        window.addEventListener("beforeunload", (e) => {
          if (dirty) {
            e.preventDefault();
            e.returnValue = "";
          }
        });

        controls(true);
        api()
          .then((data) => {
            saved = clone(data);
            live = data;
            loaded = true;
            restore(data);
            probeAll(false);
          })
          .catch(error);
        setInterval(async () => {
          if (busy || !loaded || document.hidden) return;
          try {
            live = await api();
            renderStat();
          } catch {
            /* 轮询失败静默，避免网络抖动时反复弹窗 */
          }
        }, 5000);
        setInterval(() => {
          if (busy || !loaded || probing || dirty || document.hidden) return;
          probeAll(false);
        }, 300000);
      });
    </script>
  </body>
</html>
