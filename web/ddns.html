<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1"
    />
    <title>DDNS 配置</title>
    <link rel="stylesheet" href="/static/css/layui.css" />
    <link rel="stylesheet" href="/static/css/common.css" />
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon" />
    <script src="/static/layui.js"></script>
    <style>
      body {
        margin: 0;
        padding: 0 0 25px;
        overflow-x: hidden;
        min-height: 100vh;
      }
      html {
        overflow-x: hidden;
      }
      #dirty {
        color: #c98b1d;
      }
      #dirty:empty {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="layui-container">
      <p class="page-desc">
        动态 DNS —— 监测本机公网 IP，变化时自动更新域名解析记录。一个域名一行，改完保存即生效。
      </p>

      <div class="dnet-stat" id="stat">
        <span class="s-tag">运行指标</span>
        <div class="s-kpi">
          <div class="kpi">
            <span class="k">域名配置</span>
            <span class="v" id="kpi-groups">—</span>
          </div>
          <div class="kpi">
            <span class="k">解析状态</span>
            <span class="v" id="kpi-probe">—</span>
          </div>
          <div class="kpi">
            <span class="k">解析记录</span>
            <span class="v" id="kpi-records">—</span>
          </div>
          <div class="kpi">
            <span class="k">动态取值</span>
            <span class="v dim" id="kpi-dynamic">—</span>
          </div>
          <div class="kpi">
            <span class="k">服务商</span>
            <span class="v dim" id="kpi-vendor">—</span>
          </div>
        </div>
        <div class="s-act">
          <button type="button" class="layui-btn layui-btn-primary" id="reload">
            重载配置
          </button>
        </div>
      </div>

      <form class="layui-form" lay-filter="ddns-form" onsubmit="return false">
        <div class="layui-card">
          <div class="layui-card-body">
            <div class="dnet-group">
              <span class="t">全局</span>
            </div>
            <div class="layui-form-item">
              <label class="layui-form-label" for="ddns_enable"
                >是否开启：</label
              >
              <div class="layui-input-inline">
                <input
                  type="checkbox"
                  id="ddns_enable"
                  name="ddns_enable"
                  lay-skin="switch"
                  lay-filter="global-enable"
                  lay-text="开启|关闭"
                />
              </div>
              <div class="layui-form-mid layui-word-aux">
                全局开关。关闭后 DDNS
                将停用，所有配置失效，配置内容保留。保存后生效。
              </div>
            </div>

            <div class="dnet-group">
              <span class="t">域名配置</span>
              <span class="act">
                <button
                  type="button"
                  class="layui-btn layui-btn-primary"
                  id="probe-all"
                >
                  检测解析
                </button>
              </span>
            </div>

            <div class="dnet-rules-scroll">
              <div class="dnet-rules rules-ddns">
                <div class="dnet-rules-head">
                  <span></span>
                  <span>域名</span>
                  <span>DNS 服务商</span>
                  <span>解析记录</span>
                  <span>TTL</span>
                  <span>解析状态</span>
                  <span>备注</span>
                  <span></span>
                </div>
                <div class="dnet-rules-list" id="rows"></div>
              </div>
            </div>

            <button type="button" class="dnet-rule-add" id="add-row">
              + 添加一行
            </button>
            <p class="dnet-rules-hint">
              一个域名一行，解析记录（A / AAAA / CNAME / TXT）在行首的箭头里逐条配。
              CNAME 不能与其他记录类型共存。TTL 只在 IP
              真正变化时才会更新解析，不代表查询频率。
            </p>
          </div>

          <div class="dnet-card-foot">
            <span class="note">改动将在保存后立即生效<span id="dirty"></span></span>
            <button type="button" class="layui-btn layui-btn-primary reset">
              复位
            </button>
            <button
              type="submit"
              class="layui-btn save"
              lay-submit
              lay-filter="save"
            >
              保存并应用
            </button>
          </div>
        </div>
      </form>
    </div>

    <!-- 网卡清单：由模板注入，JS 只从这里读选项。做成隐藏的 select 而不是
         JS 字面量，是为了不改 .go 里的模板数据结构。lay-ignore 是必须的：
         layui 会去渲染页面里每个没标记的 select，在这里插一堆没用的节点。 -->
    <div hidden>
      <!-- NetInterface.Address 是 []string，直接取整个字段会带上方括号
           （形如 eth0[192.168.1.10 240e:...]），所以下面用 range 逐条拼接。
           注意：这段注释里绝对不能写模板动作 —— Go 模板不会跳过 HTML 注释，
           会把它当动作执行，整页渲染当场中断（ddns/dcdn 就踩过这个坑）。 -->
      <select id="iface-ipv4" lay-ignore>
        {{range .IPv4}}
        <option value="{{.Name}}">{{.Name}} {{range .Address}}{{.}} {{end}}</option>
        {{end}}
      </select>
      <select id="iface-ipv6" lay-ignore>
        {{range .IPv6}}
        <option value="{{.Name}}">{{.Name}} {{range .Address}}{{.}} {{end}}</option>
        {{end}}
      </select>
    </div>
  </body>

  <script src="/static/common.js"></script>
  <script src="/static/dns.js"></script>
  <script>
    // 初始配置由模板注入：handleDDNSGet 把 GetDDNSConfigJSON 的结果塞进 DDNSConf
    // （access_key / access_secret 已脱敏）。字段结构与后端 DNSGroup / DNSRecord
    // 完全一致，所以这里不需要老页面那层 frontendToBackend 结构映射。
    var configData = {{.DDNSConf}};
  </script>
  <script>
    layui.use(["form", "layer"], function () {
      const form = layui.form,
        layer = layui.layer;
      const root = document.querySelector("#rows"),
        stat = document.querySelector("#stat");

      let groups = [],
        enabled = false,
        saved = null,
        dirty = false,
        busy = false,
        probing = false,
        loaded = false;
      const expanded = new Set();
      // id -> { state, meta, tip, records }。探测结果只活在前端内存里：
      // 它是「此刻的一次快照」，不参与保存，也不进配置。
      const probes = new Map();
      // 系统设置里已经配好凭据的服务商 id。凭据本身不会下发到本页，
      // 这里只够回答「这个服务商能不能直接用」。
      let configuredProviders = new Set();
      const credentialConfigured = (service) =>
        !!service && configuredProviders.has(service);

      const TTL_OPTIONS = [
        ["AUTO", "自动"],
        ["1s", "1 秒"],
        ["5s", "5 秒"],
        ["10s", "10 秒"],
        ["1m", "1 分"],
        ["2m", "2 分"],
        ["10m", "10 分"],
        ["30m", "30 分"],
        ["1h", "1 小时"],
      ];
      const ALL_TYPES = ["A", "AAAA", "CNAME", "TXT"];
      // 取值方式的文案沿用原页面（全角冒号、不空格），只有「静态 IP」那一支不需要
      // 说明来源，其余三种都在选项里点明从哪里取
      const IP_TYPES = {
        A: [
          ["static_ipv4", "静态 IPv4"],
          ["dynamic_ipv4_url", "动态 IPv4：接口获取"],
          ["dynamic_ipv4_interface", "动态 IPv4：网卡获取"],
          ["dynamic_ipv4_command", "动态 IPv4：命令获取"],
        ],
        AAAA: [
          ["static_ipv6", "静态 IPv6"],
          ["dynamic_ipv6_url", "动态 IPv6：接口获取"],
          ["dynamic_ipv6_interface", "动态 IPv6：网卡获取"],
          ["dynamic_ipv6_command", "动态 IPv6：命令获取"],
        ],
      };
      const VALUE_HINT = {
        static_ipv4: "192.168.1.10",
        static_ipv6: "2001:db8::1",
        dynamic_ipv4_url: "https://myip.ipip.net, https://4.ipw.cn",
        dynamic_ipv6_url: "https://v6.ident.me, https://6.ipw.cn",
        dynamic_ipv4_command: "执行后从 stdout 取第一个 IPv4",
        dynamic_ipv6_command: "执行后从 stdout 取第一个 IPv6",
        CNAME: "target.example.com",
        TXT: "文本内容",
      };
      // 解析状态四种取值。外观沿用端口转发那套 .dnet-conn（同一个界面里
      // 「状态」只该有一种长相），语义换成 DNS 解析。
      const PROBE_VIEW = {
        ok: { cls: "ok", label: "已解析", icon: "ok" },
        stale: { cls: "warn", label: "待同步", icon: "dash" },
        missing: { cls: "fail", label: "未解析", icon: "cross" },
        unknown: { cls: "na", label: "仅查询", icon: "dash" },
      };
      // 一个域名可能配了多条记录，收敛成一个状态时取「最需要人管的」那个
      const PROBE_RANK = { missing: 3, stale: 2, unknown: 1, ok: 0 };

      const ICON_CHEV =
        '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 2.5L8 6l-3.5 3.5"/></svg>';
      const ICON_CROSS =
        '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M3 3l6 6M9 3l-6 6"/></svg>';
      const ICON_OK =
        '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.2 6.4l2.5 2.5 5.1-5.6"/></svg>';
      const ICON_DASH =
        '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M3 6h6"/></svg>';

      const clone = (value) => JSON.parse(JSON.stringify(value));
      const esc = (value) =>
        String(value ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      const options = (list, current) =>
        list
          .map(
            (item) =>
              `<option value="${esc(item[0])}"${
                String(item[0]) === String(current) ? " selected" : ""
              }>${esc(item[1])}</option>`,
          )
          .join("");

      function ifaceList(family) {
        const tpl = document.getElementById("iface-" + family);
        if (!tpl) return [];
        return Array.from(tpl.options).map((o) => ({
          value: o.value,
          label: o.textContent.trim(),
        }));
      }
      const IFACES = { ipv4: ifaceList("ipv4"), ipv6: ifaceList("ipv6") };

      function provider(id) {
        return (typeof DNS_PROVIDERS !== "undefined" && DNS_PROVIDERS[id]) || null;
      }
      function providerList() {
        return Object.keys(
          typeof DNS_PROVIDERS !== "undefined" ? DNS_PROVIDERS : {},
        ).map((id) => [id, DNS_PROVIDERS[id].name || id]);
      }
      function recordTypesOf(id) {
        const p = provider(id);
        return (p && p.recordTypes) || ALL_TYPES;
      }

      function rowEl(id) {
        return Array.from(root.children).find((el) => el.dataset.id === id);
      }
      function markDirty() {
        dirty = true;
        document.querySelector("#dirty").textContent = "（有未提交的更改）";
      }
      function error(e) {
        const text = document.createElement("span");
        text.textContent = e.message || String(e);
        layer.msg(text.outerHTML, { icon: 2, time: 2500 });
      }
      function confirmBox(text, title) {
        return new Promise((resolve) => {
          layer.confirm(
            text,
            { title },
            (index) => {
              layer.close(index);
              resolve(true);
            },
            () => resolve(false),
          );
        });
      }
      // 本页唯一会说话的 JSON 接口就是 POST /ddns（保存）。GET 返回的是页面本体，
      // 所以没有「拉取」形态 —— 初始数据靠模板注入，重载靠 location.reload()。
      async function saveConfig(body) {
        const response = await fetch("/ddns", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        if (!response.ok) throw Error("请求失败：" + response.status);
        let result;
        try {
          result = await response.json();
        } catch {
          throw Error("请检查登录状态并刷新页面");
        }
        if (!result.status) throw Error(result.msg);
        return result.data;
      }
      // 探测走的是「把这一行的原样数据发过去、别的地方不动」，所以没保存的
      // 改动也能先查一眼。后端只拿 domain / records 去查 DNS，凭据用不上
      // （脱敏值发过去也无所谓）。
      async function probeAPI(group) {
        const response = await fetch("/api/ddns/probe", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(group),
        });
        if (!response.ok) throw Error("请求失败：" + response.status);
        let result;
        try {
          result = await response.json();
        } catch {
          throw Error("请检查登录状态并刷新页面");
        }
        if (!result.status) throw Error(result.msg);
        return result.data;
      }

      /* ---------------- 校验 ---------------- */
      function labelOf(id, field) {
        const p = provider(id);
        if (!p) return "AccessKey";
        const raw = field === "id" ? p.idLabel : p.secretLabel;
        return String(raw || "").replace(/[：:]\s*$/, "").trim();
      }
      function groupError(group) {
        const p = provider(group.service);
        if (!p) return ["service", "请选择 DNS 服务商"];
        if (!isValidAuthDomain(group.domain))
          return [
            "domain",
            "请填写正确域名，例如 example.com、*.example.com 或 _esaauth.example.com",
          ];
        // 凭据统一在「系统设置 → DNS 服务商」里按服务商维护，这里只确认配了没有 ——
        // 密钥不在这一页，也就不该在这一页被判「太短」「不能为空」。
        // callback 例外：它的凭据就是每个域名各自的回调地址，仍然填在行里。
        if (group.service === "callback") {
          if (!String(group.access_key || "").trim())
            return ["access_key", "Callback URL 不能为空"];
        } else if (!credentialConfigured(group.service)) {
          return [
            "service",
            `「${p.name || group.service}」还没有凭据，请先到 系统设置 → DNS 服务商 添加`,
          ];
        }
        if (!group.ttl) return ["ttl", "请选择 TTL"];
        const records = group.records || [];
        if (!records.length) return ["records", "至少要配一条解析记录"];
        const types = records.map((r) => r.type);
        if (types.includes("CNAME") && records.length > 1)
          return ["records", "CNAME 不能与其他记录类型共存"];
        if (new Set(types).size !== types.length)
          return ["records", "同一种记录类型只能有一条"];
        if (records.length > 20) return ["records", "一个域名最多 20 条记录"];
        for (const record of records) {
          if (!recordTypesOf(group.service).includes(record.type))
            return ["records", `当前服务商不支持记录类型 ${record.type}`];
          if (record.type === "A" || record.type === "AAAA") {
            if (!IP_TYPES[record.type].some((t) => t[0] === record.ip_type))
              return ["records", `${record.type} 记录请选择取值方式`];
          }
          if (!String(record.value || "").trim())
            return ["records", `${record.type} 记录的值不能为空`];
        }
        return null;
      }

      // 「取值方式」里带 *_interface 的两个是唯一需要把「值」换成网卡下拉的，
      // 单拎出来，渲染和禁用态走同一套判断
      function ifaceFamily(ipType) {
        const value = ipType || "";
        if (value.startsWith("dynamic_ipv4_interface")) return "ipv4";
        if (value.startsWith("dynamic_ipv6_interface")) return "ipv6";
        return "";
      }

      /* ---------------- 渲染 ---------------- */
      function recordValueCell(record) {
        const family = ifaceFamily(record.ip_type);
        if (family) {
          const list = IFACES[family];
          if (!list.length)
            return `<div class="cell-value"><select data-rk="value" lay-ignore disabled aria-label="网卡"><option value="">未检测到 ${family.toUpperCase()} 网卡</option></select></div>`;
          return `<div class="cell-value"><select data-rk="value" lay-ignore aria-label="网卡">${options(
            list.map((i) => [i.value, i.label]),
            record.value,
          )}</select></div>`;
        }
        const hintKey =
          record.type === "CNAME" || record.type === "TXT"
            ? record.type
            : record.ip_type;
        return `<div class="cell-value"><input data-rk="value" aria-label="值" placeholder="${esc(
          VALUE_HINT[hintKey] || "值",
        )}" value="${esc(record.value)}"></div>`;
      }
      // 子表里的下拉一律带 lay-ignore：layui 会把没标记的 <select> 换成它自己的
      // .layui-form-select（原 select 被 display:none），那个多出来的 div 同样是
      // 子网格的网格项，会把「记录类型 / 取值方式 / 值 / 正则 / 删除」整排挤到
      // 后面的列上去。主表的下拉（服务商 / TTL）出于同样的原因也带了这个属性。
      function recordRow(record, index, group) {
        const types = recordTypesOf(group.service);
        const ipTypes = IP_TYPES[record.type] || [];
        const needRegex = (record.ip_type || "") === "dynamic_ipv6_interface";
        return `
          <div class="dnet-sub-row" data-idx="${index}">
            <select data-rk="type" lay-ignore aria-label="记录类型">${options(
              types.map((t) => [t, t]),
              record.type,
            )}</select>
            <select data-rk="ip_type" lay-ignore aria-label="取值方式"${
              ipTypes.length ? "" : " disabled"
            }>${ipTypes.length ? options(ipTypes, record.ip_type) : '<option value="">—</option>'}</select>
            ${recordValueCell(record)}
            <input data-rk="regex" aria-label="匹配正则" placeholder="请输入正则表达式" value="${esc(record.regex)}"${needRegex ? "" : " disabled"}>
            <button type="button" class="dnet-sub-del" data-del-rec aria-label="删除该记录" title="删除该记录">${ICON_CROSS}</button>
          </div>`;
      }
      function recordsBlock(group) {
        const records = group.records || [];
        const body = records.length
          ? records.map((r, i) => recordRow(r, i, group)).join("")
          : '<p class="note">还没有记录，点右上角「添加记录」。</p>';
        return `
            <div class="dnet-sub rec" data-rec-block>
              <div class="dnet-sub-head">
                <span class="t">DNS 记录</span>
                <span class="act"><button type="button" class="dnet-sub-add" data-add-rec>+ 添加记录</button></span>
              </div>
              <div class="dnet-sub-scroll">
                <div class="dnet-sub-grid">
                  <div class="dnet-sub-head-row">
                    <span>记录类型</span>
                    <span>取值方式</span>
                    <span>值</span>
                    <span>匹配正则</span>
                    <span></span>
                  </div>
                  <div class="dnet-sub-list" data-rec-list>${body}</div>
                </div>
              </div>
            </div>`;
      }
      // 这个格子会随子表增删记录而变，靠 dnet-rec-tags 定位后整体替换。
      // class 必须两种状态都带 —— 只给「有记录」那一支补的话，从空到有记录这
      // 一步找不到节点，标签会一直停在「未配置」。
      function recordTags(group) {
        const types = (group.records || []).map((r) => r.type);
        if (!types.length)
          return '<span class="dnet-cell dnet-rec-tags is-dim">未配置</span>';
        return `<span class="dnet-cell dnet-rec-tags">${types
          .map((t) => `<span class="tag">${esc(t)}</span>`)
          .join("")}</span>`;
      }
      function refreshRecordTags(id) {
        const group = groups.find((g) => g.id === id);
        const cell = rowEl(id)?.querySelector(".dnet-rec-tags");
        if (group && cell) cell.outerHTML = recordTags(group);
      }

      /* ---------------- 解析状态 ---------------- */
      function probeOf(id) {
        return probes.get(id);
      }
      // 多条记录收敛成一个状态：只要有一条没对上就报出来，
      // 优先级 未解析 > 待同步 > 仅查询 > 已解析
      function rollupProbe(records) {
        let worst = "ok";
        for (const record of records) {
          const rank = PROBE_RANK[record.status];
          if (rank === undefined) continue;
          if (rank > PROBE_RANK[worst]) worst = record.status;
        }
        return worst;
      }
      // meta 只放「一眼要看的」：单条记录直接给实际解析值，多条给条数。
      // 完整明细（每条记录期望 vs 实际）放 tooltip。
      function probeMeta(state, records, values) {
        if (values.length === 1 && records.length === 1) return values[0];
        if (records.length) return records.length + " 条记录";
        return state === "missing" ? "无记录" : "";
      }
      function probeTip(records) {
        return records
          .map((record) => {
            const actual = (record.actual || []).length
              ? record.actual.join(", ")
              : "（无解析结果）";
            const expect = record.expect || "（未取到期望值）";
            return `${record.type}：期望 ${expect}，实际 ${actual}`;
          })
          .join("\n");
      }
      function probeCell(id) {
        const p = probeOf(id);
        if (!p)
          return '<span class="dnet-conn" title="尚未检测，点「检测解析」查看线上实际解析结果"><span class="meta">—</span></span>';
        if (p.state === "pending")
          return '<span class="dnet-conn"><span class="meta">检测中…</span></span>';
        if (p.state === "na")
          return `<span class="dnet-conn" title="${esc(p.tip)}">${ICON_DASH}<span class="meta">${esc(p.meta)}</span></span>`;
        const view = PROBE_VIEW[p.state] || PROBE_VIEW.unknown;
        const icon =
          view.icon === "ok"
            ? ICON_OK
            : view.icon === "cross"
              ? ICON_CROSS
              : ICON_DASH;
        return `<span class="dnet-conn ${view.cls}" title="${esc(p.tip)}">${icon}<span>${view.label}</span><span class="meta">${esc(p.meta)}</span></span>`;
      }
      function refreshProbe(id) {
        const cell = rowEl(id)?.querySelector(".dnet-conn-cell");
        if (cell) cell.innerHTML = probeCell(id);
      }
      function clearProbes() {
        probes.clear();
      }
      // 影响解析结果的操作（增删行、换域名/服务商、改记录）之后，
      // 旧结论一律作废 —— 留着比没有更误导。
      function invalidateProbe(id) {
        if (probes.delete(id)) refreshProbe(id);
      }
      // 探测单行。整行数据（含未保存的改动）发给后端，让它算期望值、查 DNS、
      // 比对一次 —— 「填完先看一眼对不对」和「改完看有没有生效」是同一条路径。
      async function probe(id) {
        const group = groups.find((g) => g.id === id);
        if (!group) return;
        const issue = groupError(group);
        if (issue) {
          probes.set(id, {
            state: "na",
            meta: "待补全",
            tip: `该行还有未填或无效的必填项（${issue[1]}），补全后即可检测。`,
          });
          refreshProbe(id);
          return;
        }
        probes.set(id, { state: "pending", meta: "" });
        refreshProbe(id);
        try {
          const data = await probeAPI(group);
          const records = (data && data.records) || [];
          const values = records.map((r) => (r.actual || [])[0]).filter(Boolean);
          const state = rollupProbe(records);
          probes.set(id, {
            state,
            meta: probeMeta(state, records, values),
            tip: probeTip(records) || "线上没有解析到任何记录",
            records,
          });
        } catch (e) {
          probes.set(id, {
            state: "na",
            meta: "查询失败",
            tip: e.message || String(e),
          });
        }
        refreshProbe(id);
        renderStat();
      }
      // 并发 3 而不是全开：动态取值要打外部接口，一次放太多容易一起超时。
      async function probeAll(manual) {
        if (probing || !loaded) return;
        probing = true;
        const button = document.querySelector("#probe-all");
        button.disabled = true;
        button.textContent = "检测中…";
        const queue = groups.map((g) => g.id);
        await Promise.all(
          Array.from({ length: Math.min(3, queue.length) }, async () => {
            while (queue.length) await probe(queue.shift());
          }),
        );
        probing = false;
        button.textContent = "检测解析";
        button.disabled = busy || !loaded;
        renderStat();
        if (manual) layer.msg("解析状态检测完成", { icon: 1, time: 1200 });
      }

      // 凭据统一在「系统设置 → DNS 服务商」里按服务商配一次，域名行不再各填一份 ——
      // 同一个账号配十个域名就填了十遍，换密钥还得逐个改。这里只报告状态。
      // 唯一例外是 callback：它的「凭据」其实是每个域名各自的回调地址，没法共用。
      function credentialBlock(group) {
        if (group.service === "callback") {
          return `<div data-cred-block>
              <div class="f">
                <label>${esc(labelOf("callback", "id") || "Callback URL")}</label>
                <input data-key="access_key" aria-label="Callback URL" value="${esc(group.access_key)}">
              </div>
              <div class="f">
                <label>${esc(labelOf("callback", "secret") || "请求内容")}</label>
                <input data-key="access_secret" aria-label="请求内容" value="${esc(group.access_secret)}">
              </div>
            </div>`;
        }
        const p = provider(group.service);
        const name = (p && p.name) || group.service || "该服务商";
        const ready = credentialConfigured(group.service);
        return `<div data-cred-block>
              <div class="f wide">
                <label>凭据</label>
                <span class="tip-line">${
                  ready
                    ? `<span class="dnet-cred ok">已使用系统设置里 ${esc(name)} 的凭据</span>`
                    : `<span class="dnet-cred warn">${esc(name)} 还没有配凭据</span>，请先到 <a href="/settings" target="_blank">系统设置 → DNS 服务商</a> 添加`
                }</span>
              </div>
            </div>`;
      }
      // 换服务商时整块重画：该服务商的字段名、有没有凭据都不一样
      function refreshCredentialBlock(outer, group) {
        const block = outer.querySelector("[data-cred-block]");
        if (block) block.outerHTML = credentialBlock(group);
      }

      function rowNode(group) {
        const el = document.createElement("div");
        el.className = "dnet-rule";
        el.dataset.id = group.id;
        const open = expanded.has(group.id);
        el.innerHTML = `
            <div class="dnet-rule-main">
              <button type="button" class="dnet-rule-exp" aria-expanded="${open}" aria-label="展开高级设置" title="高级设置">${ICON_CHEV}</button>
              <input data-key="domain" aria-label="域名" placeholder="ddns.example.com" value="${esc(group.domain)}">
              <select data-key="service" aria-label="DNS 服务商" lay-ignore>${options(providerList(), group.service)}</select>
              ${recordTags(group)}
              <select data-key="ttl" aria-label="TTL" lay-ignore>${options(TTL_OPTIONS, group.ttl || "AUTO")}</select>
              <span class="dnet-conn-cell">${probeCell(group.id)}</span>
              <input data-key="name" aria-label="备注" placeholder="家里宽带" value="${esc(group.name)}">
              <button type="button" class="dnet-rule-del" aria-label="删除该行" title="删除该行">${ICON_CROSS}</button>
            </div>
            <div class="dnet-rule-adv"${open ? "" : " hidden"}>
              ${credentialBlock(group)}
              ${recordsBlock(group)}
              <p class="note">
                取值方式为「网卡获取」时，只会读取所选网卡上的地址；IPv6
                还可以再给一条匹配正则，用 @1 / @2 取第几个地址。静态地址不会被自动更新。
              </p>
            </div>`;
        return el;
      }

      // 展开面板里的凭据块内容随服务商变（字段名、有没有配凭据），整体重画即可
      function syncProviderFields(el, group) {
        refreshCredentialBlock(el, group);
      }
      function renderRows() {
        root.replaceChildren(...groups.map((g) => rowNode(g)));
        form.render("checkbox");
      }
      function renderStat() {
        const records = groups.reduce((n, g) => n + (g.records || []).length, 0);
        const dynamic = groups.reduce(
          (n, g) =>
            n +
            (g.records || []).filter((r) => (r.ip_type || "").startsWith("dynamic"))
              .length,
          0,
        );
        const vendors = new Set(groups.map((g) => g.service)).size;
        // 解析状态的分子分母都用「总行数」：还没检测的行也计入分母，
        // 这样「1 / 3 已解析」里的 3 和左边「域名配置 3 个」对得上，
        // 想知道哪行没结论看行内那一格就行。
        const checked = groups.map((g) => probeOf(g.id)).filter(Boolean);
        const okProbe = checked.filter((p) => p.state === "ok").length;
        const badProbe = checked.filter(
          (p) => p.state === "stale" || p.state === "missing",
        ).length;
        const probeKpi = document.querySelector("#kpi-probe");
        probeKpi.className = "v";
        if (!groups.length) probeKpi.textContent = "—";
        else {
          probeKpi.textContent = `${okProbe} / ${groups.length} 已解析`;
          if (badProbe) probeKpi.classList.add("warn");
          else if (okProbe && okProbe === groups.length)
            probeKpi.classList.add("ok");
        }
        document.querySelector("#kpi-groups").textContent = groups.length + " 个";
        document.querySelector("#kpi-records").textContent = records + " 条";
        document.querySelector("#kpi-dynamic").textContent = dynamic + " 条";
        document.querySelector("#kpi-vendor").textContent = vendors + " 家";
        stat.classList.toggle("is-off", !enabled);
        stat.classList.toggle("is-warn", enabled && badProbe > 0);
      }
      function renderAll() {
        document.querySelector("#ddns_enable").checked = enabled;
        renderRows();
        renderStat();
        document.querySelector("#dirty").textContent = dirty
          ? "（有未提交的更改）"
          : "";
        controls(busy || !loaded);
      }
      function controls(disabled) {
        for (const node of document.querySelectorAll("button,input,select"))
          if (node.id !== "probe-all") node.disabled = disabled;
        // 「检测解析」归探测自己管：保存期间要禁，探测进行中也要禁
        document.querySelector("#probe-all").disabled = disabled || probing;
        if (!disabled)
          for (const el of root.children) {
            const group = groups.find((g) => g.id === el.dataset.id);
            if (group) syncSubRows(el, group);
          }
        form.render("checkbox");
      }
      // 子行的状态收口：控件的可填写性 + 「值」与模型对齐。
      // 后者是为了让「界面上看到的」和「提交出去的」一致 —— 网卡下拉在模型里的
      // 值若不在选项里（新建行还是空串、或原来选的网卡已不存在），浏览器会自动
      // 选中第一项，看着是填好的，一保存却报「值不能为空」。
      function syncSubRows(el, group) {
        const block = el.querySelector("[data-rec-block]");
        if (!block) return;
        (group.records || []).forEach((record, index) => {
          const row = block.querySelector(`.dnet-sub-row[data-idx="${index}"]`);
          if (!row) return;
          const family = ifaceFamily(record.ip_type);
          const value = row.querySelector('[data-rk="value"]');
          if (family && value && value.tagName === "SELECT") {
            if (value.options.length && value.value !== record.value)
              record.value = value.value;
            // 「网卡获取」但本机没有该族网卡时，值那一格是个只有一句提示的空下拉，
            // controls(false) 会把它一起放开，这里要按状态收回去
            if (!IFACES[family].length) value.disabled = true;
          }
          const regex = row.querySelector('[data-rk="regex"]');
          if (regex) regex.disabled = family !== "ipv6";
          const ipType = row.querySelector('[data-rk="ip_type"]');
          if (ipType) ipType.disabled = !(IP_TYPES[record.type] || []).length;
        });
      }

      // 网卡名要作为「值」存进配置 —— 新建记录 / 切到网卡获取时取第一块，
      // 这样模型里的值从一开始就和下拉显示的一致
      function firstIfaceValue(ipType) {
        const family = ifaceFamily(ipType);
        return family ? IFACES[family][0]?.value || "" : "";
      }
      // 记录类型或取值方式一变，「值」的语义基本就全变了（IP / URL / 命令 / 网卡名
      // / 目标域名 / 文本）—— 网卡获取自动填第一块网卡，其余一律清空，交给占位
      // 提示告诉用户这一格现在该填什么。把上一格的字符串顺手带过去提交，
      // 比清空危险得多（比如把 IPv6 的接口地址当成 CNAME 的目标域名发出去）。
      function resetValue(record) {
        record.value = firstIfaceValue(record.ip_type);
        record.regex = ifaceFamily(record.ip_type) === "ipv6" ? record.regex : "";
      }

      /* ---------------- 数据结构 ---------------- */
      function newGroup() {
        const bytes = new Uint8Array(16);
        crypto.getRandomValues(bytes);
        const first =
          typeof DNS_PROVIDERS !== "undefined"
            ? Object.keys(DNS_PROVIDERS)[0] || "alidns"
            : "alidns";
        const type = "AAAA";
        const ipType = defaultIpType(first, type);
        return {
          id: Array.from(bytes, (x) => x.toString(16).padStart(2, "0")).join(""),
          name: "配置 " + (groups.length + 1),
          domain: "",
          service: first,
          access_key: "",
          access_secret: "",
          ttl: "AUTO",
          records: [
            { type, ip_type: ipType, value: firstIfaceValue(ipType), regex: "" },
          ],
        };
      }
      function defaultIpType(service, type) {
        if (type !== "A" && type !== "AAAA") return "";
        const list = IP_TYPES[type];
        const preferred = type === "A" ? "dynamic_ipv4_interface" : "dynamic_ipv6_interface";
        return list.some((t) => t[0] === preferred) ? preferred : list[0][0];
      }
      // 换记录类型时，原来的取值方式还能不能留：同族（A 的四种 / AAAA 的四种）
      // 里存在就沿用，跨族或换成 CNAME / TXT 就重挑一个默认的
      function normalizeIpType(service, type, prevIpType) {
        if ((IP_TYPES[type] || []).some((t) => t[0] === prevIpType)) return prevIpType;
        return defaultIpType(service, type);
      }

      /* ---------------- 交互 ---------------- */
      function readField(input) {
        const row = input.closest(".dnet-rule");
        const group = row && groups.find((g) => g.id === row.dataset.id);
        if (!group) return null;
        const key = input.dataset.key;
        if (input.type === "checkbox") group[key] = input.checked;
        else group[key] = input.value;
        markDirty();
        // 域名 / 服务商一改，之前那次探测的结论就不再对应这个配置了，
        // 留着比没有更误导（比如把 A 域名查出来的结果挂在改过的域名上）
        if (key === "domain" || key === "service") invalidateProbe(group.id);
        return { group, key, row };
      }
      function readRecord(input) {
        const row = input.closest(".dnet-sub-row");
        const block = input.closest("[data-rec-block]");
        const outer = input.closest(".dnet-rule");
        const group = outer && groups.find((g) => g.id === outer.dataset.id);
        if (!row || !block || !group) return null;
        const index = Number(row.dataset.idx);
        const record = (group.records || [])[index];
        if (!record) return null;
        record[input.dataset.rk] = input.value;
        markDirty();
        invalidateProbe(group.id);
        return { group, record, index, outer, block };
      }
      function addRow() {
        if (!loaded || busy) return;
        if (groups.length >= 128) {
          error(Error("最多支持 128 个域名配置"));
          return;
        }
        const group = newGroup();
        groups.push(group);
        markDirty();
        renderRows();
        renderStat();
        const el = rowEl(group.id);
        if (el) {
          el.scrollIntoView({ block: "nearest", behavior: "smooth" });
          el.querySelector('[data-key="domain"]')?.focus({ preventScroll: true });
        }
      }
      async function removeRow(group) {
        if (!loaded || busy) return;
        if (groups.length <= 1) {
          layer.msg("至少保留一行，可关闭全局开关停用");
          return;
        }
        const confirmed = await confirmBox(
          `确定删除「${group.name || group.domain || "未命名"}」？保存后生效。`,
          "删除配置",
        );
        if (!confirmed) return;
        groups.splice(
          groups.findIndex((g) => g.id === group.id),
          1,
        );
        probes.delete(group.id);
        markDirty();
        renderRows();
        renderStat();
      }
      function addRecord(outer, group) {
        const records = group.records || (group.records = []);
        if (records.some((r) => r.type === "CNAME")) {
          layer.msg("已有 CNAME 记录，CNAME 不能与其他类型共存");
          return;
        }
        if (records.length >= 20) {
          layer.msg("一个域名最多 20 条记录");
          return;
        }
        // 同一种类型只能有一条（后端按 type 唯一），只在「当前服务商支持且还没
        // 用过」的类型里挑。CNAME 不能与其他记录共存，所以只有这一组还空着时
        // 才让它进候选 —— 否则挑到它当场就把这一组弄成非法状态，要等保存才报错。
        const used = records.map((r) => r.type);
        const candidate = recordTypesOf(group.service).filter(
          (t) => t !== "CNAME" || !records.length,
        );
        const type = candidate.find((t) => !used.includes(t));
        if (!type) {
          layer.msg("当前服务商支持的记录类型已经配满了");
          return;
        }
        const ipType = defaultIpType(group.service, type);
        records.push({
          type,
          ip_type: ipType,
          value: firstIfaceValue(ipType),
          regex: "",
        });
        markDirty();
        rerenderRecords(outer, group);
      }
      function removeRecord(outer, group, index) {
        (group.records || []).splice(index, 1);
        markDirty();
        rerenderRecords(outer, group);
      }
      // 记录子表随类型 / 取值方式变化时要整体重画（值那一格会换成网卡下拉），
      // 子表很小，整块重画比逐个换节点省事也更不容易留下半吊子状态
      function rerenderRecords(outer, group) {
        const block = outer.querySelector("[data-rec-block]");
        if (!block) return;
        const scrollTop = block.querySelector(".dnet-sub-scroll")?.scrollLeft || 0;
        block.outerHTML = recordsBlock(group);
        const next = outer.querySelector("[data-rec-block]");
        const scroller = next?.querySelector(".dnet-sub-scroll");
        if (scroller) scroller.scrollLeft = scrollTop;
        refreshRecordTags(group.id);
        syncSubRows(outer, group);
      }
      async function reload() {
        if (busy || !loaded) return;
        if (dirty) {
          const confirmed = await confirmBox(
            "放弃所有未提交的更改，从服务端重新载入配置？",
            "重载配置",
          );
          if (!confirmed) return;
        }
        // /ddns 只有「GET 返回页面本体 / POST 保存」两种形态，没有 JSON 接口，
        // 配置是服务端渲染时注入的 —— 重新加载页面才是真正的「从服务端重载」。
        location.reload();
      }
      function restore(data) {
        enabled = !!data.ddns_enable;
        // 只有服务端注入的那一份带这个字段；复位走的是本地快照，不带就沿用
        // 现有的 —— 别把「哪些服务商已经配好凭据」这条信息抹掉
        if (Array.isArray(data.configured_providers))
          configuredProviders = new Set(data.configured_providers);
        groups = clone(data.ddns || []);
        for (const group of groups) {
          if (!group.ttl) group.ttl = "AUTO";
          if (!Array.isArray(group.records)) group.records = [];
        }
        if (!groups.length) groups.push(newGroup());
        clearProbes();
        dirty = false;
        renderAll();
      }
      async function submit() {
        if (busy || !loaded) return;
        for (const group of groups) {
          const issue = groupError(group);
          if (!issue) continue;
          const el = rowEl(group.id);
          if (el) {
            el.scrollIntoView({ block: "center", behavior: "smooth" });
            const adv = el.querySelector(".dnet-rule-adv");
            if (adv && adv.hidden) {
              adv.hidden = false;
              el.querySelector(".dnet-rule-exp")?.setAttribute(
                "aria-expanded",
                "true",
              );
              expanded.add(group.id);
            }
            const field = el.querySelector(`[data-key="${issue[0]}"]`);
            if (field) field.focus({ preventScroll: true });
          }
          layer.msg(`${group.name || group.domain || "未命名"}：${issue[1]}`, {
            icon: 2,
            time: 3000,
          });
          return;
        }
        busy = true;
        controls(true);
        try {
          const data = await saveConfig({
            ddns_enable: enabled,
            ddns: groups,
          });
          // 保存后调度器是异步同步的，DNS 本身还有 TTL 缓存 —— 此刻立刻探测
          // 多半还是旧值，显示出来就是一个必然的「待同步」假警报。宁可清空
          // 结论，让用户过一会儿自己点「检测解析」。
          clearProbes();
          // POST /ddns 只回一句 msg，data 是 null —— 别拿它去覆盖本地状态
          if (!data) {
            saved = clone({ ddns_enable: enabled, ddns: groups });
            dirty = false;
            renderAll();
            layer.msg("配置保存并应用成功", { icon: 1, time: 1200 });
            return;
          }
          saved = clone(data);
          restore(data);
          layer.msg("配置保存并应用成功", { icon: 1, time: 1200 });
        } catch (e) {
          error(e);
        } finally {
          busy = false;
          controls(false);
        }
      }
      async function reset() {
        if (!saved || busy) return;
        if (!dirty) {
          restore(saved);
          return;
        }
        const confirmed = await confirmBox(
          "放弃所有未提交的更改，恢复到上次提交状态？",
          "复位配置",
        );
        if (confirmed) restore(saved);
      }

      root.addEventListener("input", (e) => {
        if (e.target.dataset.key) readField(e.target);
        else if (e.target.dataset.rk === "value" || e.target.dataset.rk === "regex")
          readRecord(e.target);
      });
      root.addEventListener("change", (e) => {
        const target = e.target;
        if (target.dataset.rk) {
          const hit = readRecord(target);
          if (!hit) return;
          const { group, record, outer } = hit;
          if (target.dataset.rk === "type") {
            // 类型一变，取值方式、值、正则都可能不再适用
            record.ip_type = normalizeIpType(
              group.service,
              record.type,
              record.ip_type,
            );
            resetValue(record);
            const others = (group.records || []).filter((r) => r !== record);
            if (record.type === "CNAME" && others.length) {
              layer.msg("CNAME 不能与其他记录类型共存，已删除其他记录");
              group.records = [record];
            } else if (others.some((r) => r.type === "CNAME")) {
              layer.msg("已有 CNAME 记录，不能添加其他类型");
              record.type = "CNAME";
              record.ip_type = "";
            }
            rerenderRecords(outer, group);
            return;
          }
          if (target.dataset.rk === "ip_type") {
            resetValue(record);
            rerenderRecords(outer, group);
            return;
          }
          return;
        }
        if (!target.dataset.key) return;
        const hit = readField(target);
        if (!hit) return;
        const { group, key, row } = hit;
        if (key === "service") {
          syncProviderFields(row, group);
          // 换了服务商，原来支持的类型可能不认了 —— 只保留合法的记录
          const allowed = recordTypesOf(group.service);
          const before = (group.records || []).length;
          group.records = (group.records || []).filter((r) =>
            allowed.includes(r.type),
          );
          if (group.records.length !== before)
            layer.msg("新服务商不支持部分记录类型，已移除");
          rerenderRecords(row, group);
          return;
        }
        if (key === "name" || key === "domain") refreshRecordTags(group.id);
      });
      root.addEventListener("click", (e) => {
        const outer = e.target.closest(".dnet-rule");
        if (!outer) return;
        const group = groups.find((g) => g.id === outer.dataset.id);
        if (!group) return;
        if (e.target.closest(".dnet-rule-exp")) {
          const adv = outer.querySelector(".dnet-rule-adv");
          adv.hidden = !adv.hidden;
          outer
            .querySelector(".dnet-rule-exp")
            .setAttribute("aria-expanded", String(!adv.hidden));
          if (adv.hidden) expanded.delete(group.id);
          else expanded.add(group.id);
          return;
        }
        if (e.target.closest(".dnet-rule-del")) {
          removeRow(group);
          return;
        }
        if (e.target.closest("[data-add-rec]")) {
          addRecord(outer, group);
          return;
        }
        if (e.target.closest("[data-del-rec]")) {
          const row = e.target.closest(".dnet-sub-row");
          if (row) removeRecord(outer, group, Number(row.dataset.idx));
        }
      });

      document.querySelector("#add-row").onclick = addRow;
      document.querySelector("#reload").onclick = reload;
      document.querySelector("#probe-all").onclick = () => probeAll(true);
      for (const button of document.querySelectorAll(".reset"))
        button.onclick = reset;

      form.on("submit(save)", function () {
        submit();
        return false;
      });
      form.on("switch(global-enable)", (data) => {
        enabled = data.elem.checked;
        markDirty();
        renderStat();
      });
      window.addEventListener("beforeunload", (e) => {
        if (dirty) {
          e.preventDefault();
          e.returnValue = "";
        }
      });

      // 初始数据全部来自模板注入的 configData，没有可用的 JSON GET
      const injected =
        configData && typeof configData === "object"
          ? configData
          : { ddns_enable: false, ddns: [] };
      loaded = true;
      restore(injected);
      // saved 存的是「归一化之后」的状态（ttl 补默认、records 保证是数组），
      // 复位时直接回到这里
      saved = clone({ ddns_enable: enabled, ddns: groups });
      // 首次进来主动查一遍线上解析：这是「我现在配的到底生效没有」最直接的答案。
      probeAll(false);
    });
  </script>
</html>
