<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>D-NET</title>
    <link rel="stylesheet" href="/static/css/layui.css">
    <link rel="stylesheet" href="/static/css/common.css">
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
    <script src="/static/layui.js"></script>
    <style>
        /* 日志轮询用的右上角气泡提示 */
        .layui-layer-right-top.layui-layer-msg {
            top: 52px !important;
            background-color: rgba(0, 0, 0, .6);
            border: none;
            color: #fff;
        }

        .layui-layer-right-top.layui-layer-msg .layui-layer-content {
            padding: 8px 15px !important;
            word-break: break-all;
        }

        .layui-layer-right-top-error.layui-layer-msg {
            top: 52px !important;
            background-color: rgba(0, 0, 0, .6);
            border: none;
            color: #ffb3ad;
        }

        .layui-layer-right-top-error.layui-layer-msg .layui-layer-content {
            padding: 8px 15px !important;
            word-break: break-all;
        }

        /* 侧栏底部的样式已移到 common.css 第 17.2 节，这里只留链接本身的处理
           （内联样式排在 common.css 之后，同优先级下会赢） */
        .dnet-side-foot a {
            color: var(--muted);
            text-decoration: none;
        }

        .dnet-side-foot a:hover {
            color: var(--brand);
            text-decoration: underline;
        }
    </style>
</head>
<body class="dnet-shell">
<div class="dnet-app">

    <!-- ============ 左侧导航：模块身份的唯一落点 ============ -->
    <aside class="dnet-sidebar">
        <div class="dnet-brand">
            <a href="/">D-NET</a>
            <small>动态 NET 解析管理系统</small>
        </div>

        <nav class="dnet-nav">
            <a class="dnet-nav-item active" data-route="overview">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6.5v6.5H4z"/><path d="M13.5 4H20v4h-6.5z"/><path d="M13.5 11.5H20V20h-6.5z"/><path d="M4 13.5h6.5V20H4z"/></svg>状态总览
            </a>

            <div class="dnet-nav-sep"></div>
            <div class="dnet-nav-title">服务</div>
            <a class="dnet-nav-item" data-route="dcdn">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 4.5 13H11l-1 9 8.5-11H12l1-9z"/></svg>动态 CDN<span class="tag">DCDN</span>
            </a>
            <a class="dnet-nav-item" data-route="ddns">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 11.5a8.5 8.5 0 1 1-2.5-6"/><path d="M21 4.5V9h-4.5"/></svg>动态 DNS<span class="tag">DDNS</span>
            </a>
            <a class="dnet-nav-item" data-route="dpf">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h13l-3.5-3.5"/><path d="M20 16H7l3.5 3.5"/></svg>端口转发<span class="tag">DPF</span>
            </a>
            <a class="dnet-nav-item" data-route="dws">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c2.4 2.6 3.7 5.6 3.7 9S14.4 18.4 12 21c-2.4-2.6-3.7-5.6-3.7-9S9.6 5.6 12 3z"/></svg>Web 服务<span class="tag">DWS</span>
            </a>
            <a class="dnet-nav-item" data-route="waf">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7.5 3v6c0 4.6-3.2 8.4-7.5 9.5C7.7 20.4 4.5 16.6 4.5 12V6L12 3z"/><path d="M9.3 12.2l1.9 1.9 3.6-3.9"/></svg>WAF<span class="tag">Coraza</span>
            </a>
            <a class="dnet-nav-item" data-route="dssl">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7.5 3v6c0 4.6-3.2 8.4-7.5 9.5C7.7 20.4 4.5 16.6 4.5 12V6L12 3z"/><path d="M9.3 12.2l1.9 1.9 3.6-3.9"/></svg>证书管理<span class="tag">DSSL</span>
            </a>

            <div class="dnet-nav-sep"></div>
            <div class="dnet-nav-title">系统</div>
            <a class="dnet-nav-item" data-route="settings">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2v.3a2 2 0 1 1-4 0v-.2a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1.1H3a2 2 0 1 1 0-4h.2A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.2a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.2a1.7 1.7 0 0 0-1.4 1z"/></svg>系统设置
            </a>
            <a class="dnet-nav-item" data-route="webhook">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 13.5a5 5 0 0 0 7.1 0l2.4-2.4a5 5 0 0 0-7.1-7.1l-1.4 1.4"/><path d="M13.5 10.5a5 5 0 0 0-7.1 0l-2.4 2.4a5 5 0 0 0 7.1 7.1l1.4-1.4"/></svg>Webhook
            </a>
        </nav>

        <div class="dnet-side-foot">
            D-NET {{.Version}} ·
            <a href="https://github.com/cxbdasheng/dnet" target="_blank">GitHub</a>
            <br>基于 MIT 开源协议 · © 2025{{if gt .CurrentYear 2025}}–{{.CurrentYear}}{{end}}
        </div>
    </aside>

    <!-- ============ 主区 ============ -->
    <div class="dnet-main">
        <!-- 顶栏：sticky，滚到表单中段也看得见。只承载「服务状态」，
             模块身份一律交给左侧导航，避免同一信息出现两处。 -->
        <div class="dnet-topstrip">
            <button type="button" class="dnet-menu-btn" id="menu-toggle" title="展开导航" aria-label="展开导航">
                <svg class="menu-ico" viewBox="0 0 24 24" aria-hidden="true">
                    <path class="i-menu" d="M4 7h16M4 12h16M4 17h16"/>
                    <path class="i-close" d="M6 6l12 12M18 6L6 18"/>
                </svg>
            </button>
            <span class="dnet-dot" id="strip-dot"></span>
            <span class="dnet-strip-name" id="strip-name">服务运行中</span>
            <i class="dnet-strip-sub" id="strip-sub" hidden></i>
            <!-- 信号轨：五段 = 五个模块，颜色 = 各自此刻的状态。
                 由 /api/overview 的 services[] 渲染（见 renderOverview）。
                 纯装饰，状态文字已经由左侧的灯 + 文案承担，所以对读屏隐藏。 -->
            <span class="dnet-rail" id="strip-rail" aria-hidden="true"></span>
            <div class="dnet-strip-right">
                <a href="./logout" title="退出登录">
                    <img src="/static/default.jpg" alt=""
                         style="width:22px;height:22px;border-radius:50%;border:1px solid rgba(255,255,255,.5);display:block;">
                    <span>退出</span>
                </a>
            </div>
        </div>

        <div class="dnet-content">
            <iframe id="content-frame" src="/overview" frameborder="0"></iframe>
        </div>
    </div>

    <div class="dnet-shade"></div>
</div>
</body>
<script>
    layui.use(['element', 'layer', 'util', 'form'], function () {
        var layer = layui.layer;
        var $ = layui.$;

        /* ---------------- 导航：模块切换 ---------------- */
        // 路由表：data-route -> 后端路径
        var ROUTES = {
            overview: '/overview',
            dcdn: '/dcdn',
            ddns: '/ddns',
            dpf: '/forward',
            dws: '/webservice',
            waf: '/waf',
            dssl: '/certificates',
            settings: '/settings',
            webhook: '/webhook'
        };
        // 反向表：后端路径 -> data-route（iframe 的 load 事件靠它回推高亮）
        var PATH2ROUTE = {
            '/overview': 'overview',
            '/dcdn': 'dcdn',
            '/ddns': 'ddns',
            '/forward': 'dpf',
            '/webservice': 'dws',
            '/waf': 'waf',
            '/certificates': 'dssl',
            '/settings': 'settings',
            '/webhook': 'webhook'
        };

        var currentRoute = 'overview';

        function selectNav(route) {
            $('.dnet-nav-item[data-route]').each(function () {
                $(this).toggleClass('active', $(this).attr('data-route') === route);
            });
        }

        selectNav(currentRoute);

        $('.dnet-nav-item[data-route]').on('click', function () {
            var route = $(this).attr('data-route');
            closeDrawer();
            if (!ROUTES[route] || route === currentRoute) return;
            currentRoute = route;
            selectNav(route);
            $('#content-frame').attr('src', ROUTES[route]);
        });

        // 由各页面的 beforeunload 统一触发浏览器原生提醒。
        // 仅在页面实际加载后更新选中项，取消离开时保留当前导航。
        $('#content-frame').on('load', function () {
            // 切换模块后立即取一次状态，不必等下一个轮询周期
            pollOverview();

            var pathname = '';
            try {
                pathname = this.contentWindow.location.pathname;
            } catch (e) {
                return; // 跨文档异常时保持现状
            }
            var route = PATH2ROUTE[pathname];
            if (route && route !== currentRoute) {
                currentRoute = route;
                selectNav(route);
            }
        });

        /* ---------------- 移动端抽屉 ---------------- */
        function closeDrawer() {
            $('body').removeClass('nav-open');
            $('#menu-toggle').removeClass('is-open');
        }

        $('#menu-toggle').on('click', function () {
            var open = !$('body').hasClass('nav-open');
            $('body').toggleClass('nav-open', open);
            $(this).toggleClass('is-open', open);
        });

        $('.dnet-shade').on('click', closeDrawer);

        /* ---------------- 顶栏状态轮询 ---------------- */
        // /api/overview 汇总各模块的启用与运行状态。
        // 页内保存配置走 AJAX，iframe 不会重新 load，所以靠定时轮询兜底；
        // 切换模块会触发 iframe 的 load 事件，那里会立即刷新一次。
        var OVERVIEW_POLL_MS = 30000;
        var overviewTimer = null;

        /* 顶栏信号轨的段：段数固定为模块数，颜色用与 .dnet-dot 同一套语义色。
           用 DOM API 拼而不是 innerHTML —— 内容来自接口，虽然眼下全是后端
           常量，也没必要为它开一个拼字符串的口子。 */
        var RAIL_STATE_CLASS = {on: 'is-on', warn: 'is-warn', err: 'is-err', off: 'is-off'};
        var railSignature = null;

        function renderRail(services) {
            var rail = document.getElementById('strip-rail');
            if (!rail || !services) return;

            // 状态没变就不重建：重建会让每段的重扫光动画从头开始，30 秒闪一下
            var signature = services.map(function (service) {
                return service.id + ':' + service.state;
            }).join('|');
            if (signature === railSignature) return;
            railSignature = signature;

            rail.textContent = '';
            services.forEach(function (service) {
                var seg = document.createElement('i');
                seg.className = 'seg ' + (RAIL_STATE_CLASS[service.state] || 'is-off');
                seg.title = service.name + ' · ' + service.text;
                rail.appendChild(seg);
            });
        }

        function renderOverview(data) {
            var dot = document.getElementById('strip-dot');
            var name = document.getElementById('strip-name');
            var sub = document.getElementById('strip-sub');
            if (!name) return;

            name.textContent = data.text || '服务运行中';

            if (sub) {
                sub.textContent = data.sub || '';
                sub.hidden = !data.sub;
            }

            if (dot) {
                // CSS 只定义了 .off / .warn / .err 三个覆盖类，on 走默认样式
                var state = data.state;
                dot.className = 'dnet-dot' + (state && state !== 'on' ? ' ' + state : '');
            }

            renderRail(data.services);
        }

        function pollOverview() {
            fetch('/api/overview', {
                method: 'GET',
                headers: {'Content-Type': 'application/json'}
            })
                .then(function (response) {
                    return response.json();
                })
                .then(function (data) {
                    if (!data.status || !data.data) return;
                    renderOverview(data.data);
                })
                .catch(function (error) {
                    // 取不到状态时保持上一次的值，不把顶栏清空
                    console.error('顶栏状态轮询失败:', error);
                });
        }

        pollOverview();
        overviewTimer = setInterval(pollOverview, OVERVIEW_POLL_MS);
    });
</script>
</html>
