<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1"
    />
    <title>动态 CDN 配置</title>
    <link rel="stylesheet" href="/static/css/layui.css" />
    <link rel="stylesheet" href="/static/css/common.css" />
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon" />
    <script src="/static/layui.js"></script>
    <style>
      body {
        margin: 0;
        padding: 0 0 25px;
        overflow-x: hidden;
        min-height: 100vh;
      }
      html {
        overflow-x: hidden;
      }
      #dirty {
        color: #c98b1d;
      }
      #dirty:empty {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="layui-container">
      <p class="page-desc">
        动态 CDN —— 监测本机公网 IP，变化时自动把 CDN 的源站地址更新到新 IP。一个域名一行，改完保存即生效。
      </p>

      <div class="dnet-stat" id="stat">
        <span class="s-tag">运行指标</span>
        <div class="s-kpi">
          <div class="kpi">
            <span class="k">域名配置</span>
            <span class="v" id="kpi-cdns">—</span>
          </div>
          <div class="kpi">
            <span class="k">源站</span>
            <span class="v" id="kpi-sources">—</span>
          </div>
          <div class="kpi">
            <span class="k">动态源站</span>
            <span class="v dim" id="kpi-dynamic">—</span>
          </div>
          <div class="kpi">
            <span class="k">服务商</span>
            <span class="v dim" id="kpi-vendor">—</span>
          </div>
        </div>
        <div class="s-act">
          <button type="button" class="layui-btn layui-btn-primary" id="reload">
            重载配置
          </button>
        </div>
      </div>

      <form class="layui-form" lay-filter="dcdn-form" onsubmit="return false">
        <div class="layui-card">
          <div class="layui-card-body">
            <div class="dnet-group">
              <span class="t">全局</span>
            </div>
            <div class="layui-form-item">
              <label class="layui-form-label" for="dcdn_enable"
                >是否开启：</label
              >
              <div class="layui-input-inline">
                <input
                  type="checkbox"
                  id="dcdn_enable"
                  name="dcdn_enable"
                  lay-skin="switch"
                  lay-filter="global-enable"
                  lay-text="开启|关闭"
                />
              </div>
              <div class="layui-form-mid layui-word-aux">
                全局开关。关闭后 DCDN
                将停用，所有配置失效，配置内容保留。保存后生效。
              </div>
            </div>

            <div class="dnet-group">
              <span class="t">域名配置</span>
            </div>

            <div class="dnet-rules-scroll">
              <div class="dnet-rules rules-dcdn">
                <div class="dnet-rules-head">
                  <span></span>
                  <span>域名</span>
                  <span>CDN 服务商</span>
                  <span>类型</span>
                  <span>源站</span>
                  <span>备注</span>
                  <span></span>
                </div>
                <div class="dnet-rules-list" id="rows"></div>
              </div>
            </div>

            <button type="button" class="dnet-rule-add" id="add-row">
              + 添加一行
            </button>
            <p class="dnet-rules-hint">
              一个域名一行，CNAME、凭据、源站都在行首的箭头里配。源站数上限由服务商与类型决定（阿里云
              ESA、腾讯云 EdgeOne、Cloudflare、又拍云只允许 1
              个）。保存后会自动去服务端取一次 CNAME。
            </p>
          </div>

          <div class="dnet-card-foot">
            <span class="note">改动将在保存后立即生效<span id="dirty"></span></span>
            <button type="button" class="layui-btn layui-btn-primary reset">
              复位
            </button>
            <button
              type="submit"
              class="layui-btn save"
              lay-submit
              lay-filter="save"
            >
              保存并应用
            </button>
          </div>
        </div>
      </form>
    </div>

    <!-- 网卡清单：由模板注入，JS 只从这里读选项。做成隐藏的 select 而不是
         JS 字面量，是为了不改 .go 里的模板数据结构。lay-ignore 是必须的：
         layui 会去渲染页面里每个没标记的 select，在这里插一堆没用的节点。 -->
    <div hidden>
      <!-- NetInterface.Address 是 []string，直接取整个字段会带上方括号
           （形如 eth0[192.168.1.10 240e:...]），所以下面用 range 逐条拼接。
           注意：这段注释里绝对不能写模板动作 —— Go 模板不会跳过 HTML 注释，
           会把它当动作执行，整页渲染当场中断（dcdn/ddns 就踩过这个坑）。 -->
      <select id="iface-ipv4" lay-ignore>
        {{range .IPv4}}
        <option value="{{.Name}}">{{.Name}} {{range .Address}}{{.}} {{end}}</option>
        {{end}}
      </select>
      <select id="iface-ipv6" lay-ignore>
        {{range .IPv6}}
        <option value="{{.Name}}">{{.Name}} {{range .Address}}{{.}} {{end}}</option>
        {{end}}
      </select>
    </div>
  </body>

  <script src="/static/common.js"></script>
  <script src="/static/cdn.js"></script>
  <script>
    // 初始配置由模板注入：handleDCDNGet 把 GetDCDNConfigJSON 的结果塞进 DCDNConf
    // （access_key / access_secret 已脱敏）。字段结构与后端 CDN / Source 完全一致，
    // 所以这里不需要老页面那层结构映射。
    var configData = {{.DCDNConf}};
  </script>
  <script>
    layui.use(["form", "layer"], function () {
      const form = layui.form,
        layer = layui.layer;
      const root = document.querySelector("#rows"),
        stat = document.querySelector("#stat");

      let configs = [],
        enabled = false,
        saved = null,
        dirty = false,
        busy = false,
        loaded = false;
      const expanded = new Set();
      // 系统设置里已经配好凭据的 CDN 服务商 id。凭据本身不会下发到本页，
      // 这里只够回答「这个服务商能不能直接用」。
      let configuredProviders = new Set();
      const credentialConfigured = (service) =>
        !!service && configuredProviders.has(service);

      const FIRST_PROVIDER = Object.keys(CDN_PROVIDERS)[0] || "aliyun";
      const FIRST_TYPE =
        (CDN_PROVIDERS[FIRST_PROVIDER] &&
          CDN_PROVIDERS[FIRST_PROVIDER].typeSelect &&
          CDN_PROVIDERS[FIRST_PROVIDER].typeSelect[0]) ||
        "CDN";

      // 源站类型：文案沿用原页面（全角冒号）
      const SOURCE_TYPES = [
        ["domain", "域名"],
        ["static_ipv4", "静态 IPv4"],
        ["static_ipv6", "静态 IPv6"],
        ["dynamic_ipv4_url", "动态 IPv4：接口获取"],
        ["dynamic_ipv4_interface", "动态 IPv4：网卡获取"],
        ["dynamic_ipv4_command", "动态 IPv4：命令获取"],
        ["dynamic_ipv6_url", "动态 IPv6：接口获取"],
        ["dynamic_ipv6_interface", "动态 IPv6：网卡获取"],
        ["dynamic_ipv6_command", "动态 IPv6：命令获取"],
      ];
      const PRIORITIES = [
        ["main", "主站"],
        ["backup", "备站"],
      ];
      const PROTOCOLS = [
        ["HTTP", "HTTP"],
        ["HTTPS", "HTTPS"],
        ["AUTO", "协议跟随"],
      ];
      // 源站「值」那一格的占位提示 —— 告诉用户这里该填什么形状的东西
      const SOURCE_HINT = {
        domain: "例如 cdn-origin.example.com",
        static_ipv4: "192.168.1.10",
        static_ipv6: "240e:3b3:2000::1",
        dynamic_ipv4_url: "https://myip.ipip.net, https://4.ipw.cn",
        dynamic_ipv6_url: "https://speed.neu6.edu.cn/getIP.php, https://6.ipw.cn",
        dynamic_ipv4_command: "取 stdout 里的第一个 IPv4",
        dynamic_ipv6_command: "取 stdout 里的第一个 IPv6",
      };
      const DEFAULT_IPV4_URL =
        "https://myip.ipip.net, https://ddns.oray.com/checkip, https://ip.3322.net, https://4.ipw.cn, https://v4.yinghualuo.cn/bejson";
      const DEFAULT_IPV6_URL =
        "https://speed.neu6.edu.cn/getIP.php, https://v6.ident.me, https://6.ipw.cn, https://v6.yinghualuo.cn/bejson";
      // common.js 里的三条只覆盖完整/压缩/混合三种写法，原页面还兜了一条简化式
      const SIMPLE_IPV6 = /^([0-9a-fA-F]{0,4}:){1,7}[0-9a-fA-F]{0,4}$|^::$/;

      const ICON_CHEV =
        '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 2.5L8 6l-3.5 3.5"/></svg>';
      const ICON_CROSS =
        '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M3 3l6 6M9 3l-6 6"/></svg>';

      const clone = (value) => JSON.parse(JSON.stringify(value));
      const esc = (value) =>
        String(value ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      const options = (list, current) =>
        list
          .map(
            (item) =>
              `<option value="${esc(item[0])}"${
                String(item[0]) === String(current) ? " selected" : ""
              }>${esc(item[1])}</option>`,
          )
          .join("");

      function provider(id) {
        return (typeof CDN_PROVIDERS !== "undefined" && CDN_PROVIDERS[id]) || null;
      }
      function providerList() {
        return Object.keys(
          typeof CDN_PROVIDERS !== "undefined" ? CDN_PROVIDERS : {},
        ).map((id) => [id, CDN_PROVIDERS[id].name || id]);
      }
      function firstTypeOf(service) {
        const p = provider(service);
        return (p && p.typeSelect && p.typeSelect[0]) || "CDN";
      }
      function typeList(service) {
        const p = provider(service);
        const list = (p && p.typeSelect) || [];
        return (list.length ? list : ["CDN"]).map((t) => [t, t]);
      }
      function labelOf(service, field) {
        const p = provider(service);
        if (!p) return field === "id" ? "AccessKey" : "AccessSecret";
        const raw = field === "id" ? p.idLabel : p.secretLabel;
        return String(raw || "").replace(/[：:]\s*$/, "").trim();
      }
      // 源站数上限：maxSources 与 typeSelect 同序，按类型的下标取值
      function maxSources(config) {
        const p = provider(config.service);
        if (!p || !p.maxSources || !p.typeSelect) return Infinity;
        const index = p.typeSelect.indexOf(config.cdn_type);
        if (index === -1 || index >= p.maxSources.length) return Infinity;
        return p.maxSources[index];
      }
      // 端口提示：原数据是 "<tip>…</tip>"，页面里没有 tip 元素了，取里面的内容
      function protocolTip(config) {
        const p = provider(config.service);
        if (!p || !p.protocolTipHtml) return "";
        const raw = Array.isArray(p.protocolTipHtml)
          ? p.typeSelect
            ? p.protocolTipHtml[p.typeSelect.indexOf(config.cdn_type)]
            : ""
          : p.protocolTipHtml;
        if (!raw) return "";
        const matched = /^<tip>([\s\S]*)<\/tip>$/.exec(String(raw).trim());
        return matched ? matched[1] : String(raw);
      }
      function helpHtml(config) {
        const p = provider(config.service);
        return (p && p.idHelpHtml) || "请填写服务商的 API 凭据。";
      }
      function typeHelpHtml(config) {
        const p = provider(config.service);
        return (p && p.typeHelpHtml) || "";
      }

      function ifaceList(family) {
        const tpl = document.getElementById("iface-" + family);
        if (!tpl) return [];
        return Array.from(tpl.options).map((o) => ({
          value: o.value,
          label: o.textContent.trim(),
        }));
      }
      const IFACES = { ipv4: ifaceList("ipv4"), ipv6: ifaceList("ipv6") };
      // 「取值方式」里唯二需要把「值」换成网卡下拉的类型，渲染与禁用态共用
      function ifaceFamily(sourceType) {
        if (sourceType === "dynamic_ipv4_interface") return "ipv4";
        if (sourceType === "dynamic_ipv6_interface") return "ipv6";
        return "";
      }
      function firstIfaceValue(sourceType) {
        const family = ifaceFamily(sourceType);
        return family ? IFACES[family][0]?.value || "" : "";
      }
      function needsRegex(source) {
        return source.type === "dynamic_ipv6_interface";
      }
      // 端口的可用性 = 协议决定哪个端口有意义 ∩ 服务商/类型不允许自定义的部分。
      // 原页面是按协议把不适用的那一列整个藏起来，行列表里列不能随便消失
      // （后面的格子会顺势挪位），所以改成置灰禁用 —— 语义一样，排版稳定。
      function portRules(config, source) {
        let http = true,
          https = true;
        if (config.service === "aliyun" && config.cdn_type === "ESA") {
          http = false;
          https = false;
        } else if (
          config.service === "aliyun" &&
          (config.cdn_type === "CDN" || config.cdn_type === "DCDN")
        ) {
          https = false;
        } else if (
          config.service === "tencent" &&
          config.cdn_type === "CDN" &&
          source.protocol === "AUTO"
        ) {
          http = false;
          https = false;
        }
        if (source.protocol === "HTTP") https = false;
        if (source.protocol === "HTTPS") http = false;
        return { http, https };
      }

      function rowEl(id) {
        return Array.from(root.children).find((el) => el.dataset.id === id);
      }
      function markDirty() {
        dirty = true;
        document.querySelector("#dirty").textContent = "（有未提交的更改）";
      }
      function error(e) {
        const text = document.createElement("span");
        text.textContent = e.message || String(e);
        layer.msg(text.outerHTML, { icon: 2, time: 2500 });
      }
      function confirmBox(text, title) {
        return new Promise((resolve) => {
          layer.confirm(
            text,
            { title },
            (index) => {
              layer.close(index);
              resolve(true);
            },
            () => resolve(false),
          );
        });
      }

      // GET /api/dcdn/config 回的是**裸配置**（没有 {status,msg,data} 外壳）——
      // 这是它和 /api/webservice 不一样的地方，别照抄那边的解析
      async function fetchConfig() {
        const response = await fetch("/api/dcdn/config", {
          headers: { Accept: "application/json" },
        });
        if (!response.ok) throw Error("请求失败：" + response.status);
        try {
          const data = await response.json();
          // 别把「哪些服务商已经配好凭据」这条信息抹掉
          if (Array.isArray(data.configured_providers))
            configuredProviders = new Set(data.configured_providers);
          return data;
        } catch {
          throw Error("请检查登录状态并刷新页面");
        }
      }
      // POST /dcdn 只回一句 msg，data 是 null
      async function saveConfig(body) {
        const response = await fetch("/dcdn", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        if (!response.ok) throw Error("请求失败：" + response.status);
        let result;
        try {
          result = await response.json();
        } catch {
          throw Error("请检查登录状态并刷新页面");
        }
        if (!result.status) throw Error(result.msg);
        return result.data;
      }

      /* ---------------- 校验 ---------------- */
      function sourceError(config, source, index) {
        const where = "源站 " + (index + 1);
        const value = String(source.value || "").trim();
        const type = source.type;
        if (type === "domain") {
          if (!value) return [where, "域名不能为空"];
          if (!isValidDomain(value))
            return [where, "请输入正确的域名格式，例如：example.com 或 *.example.com"];
        } else if (type === "static_ipv4") {
          if (!value) return [where, "IPv4 地址不能为空"];
          if (!ipv4Regex.test(value))
            return [where, "请输入正确的 IPv4 地址格式，例如：192.168.1.1"];
        } else if (type === "static_ipv6") {
          if (!value) return [where, "IPv6 地址不能为空"];
          if (
            !ipv6FullRegex.test(value) &&
            !ipv6CompressedRegex.test(value) &&
            !ipv6MixedRegex.test(value) &&
            !SIMPLE_IPV6.test(value)
          )
            return [where, "请输入正确的 IPv6 地址格式，例如：2001:db8::1 或 ::1"];
        } else if (type === "dynamic_ipv4_url" || type === "dynamic_ipv6_url") {
          if (!value) return [where, "接口地址不能为空"];
        } else if (
          type === "dynamic_ipv4_command" ||
          type === "dynamic_ipv6_command"
        ) {
          if (!value) return [where, "命令内容不能为空"];
        } else if (ifaceFamily(type)) {
          if (!value) return [where, "请选择网卡"];
        } else {
          return [where, "请选择源站类型"];
        }
        if (!PRIORITIES.some((p) => p[0] === source.priority))
          return [where, "请选择优先级"];
        // 权重在旧页面里定义了校验规则却没挂到字段上（死规则），这里补上：
        // 0 或 999 以前能直接提交出去
        const weight = Number(source.weight);
        if (!Number.isInteger(weight) || weight < 1 || weight > 100)
          return [where, "权重必须是 1-100 之间的整数"];
        const rule = portRules(config, source);
        const port = Number(source.port),
          httpsPort = Number(source.https_port);
        if (
          rule.http &&
          (!Number.isInteger(port) || port < 1 || port > 65535)
        )
          return [where, "HTTP 端口必须是 1-65535 之间的整数"];
        if (
          rule.https &&
          (!Number.isInteger(httpsPort) || httpsPort < 1 || httpsPort > 65535)
        )
          return [where, "HTTPS 端口必须是 1-65535 之间的整数"];
        if (!PROTOCOLS.some((p) => p[0] === source.protocol))
          return [where, "请选择协议"];
        return null;
      }

      // 返回 [配置名, 提示, 要聚焦的字段 key]；字段 key 为空表示没有单点可聚焦
      function configError(config) {
        const label = config.name || config.domain || "未命名";
        if (!provider(config.service))
          return [label, "请选择 CDN 服务商", "service"];
        const domain = String(config.domain || "").trim();
        if (!domain) return [label, "请填写域名", "domain"];
        if (!isValidDomain(domain))
          return [label, "请输入正确的域名格式，例如：www.example.com 或 *.example.com", "domain"];
        if (!typeList(config.service).some((t) => t[0] === config.cdn_type))
          return [label, "请选择 CDN 类型", "cdn_type"];
        const p = provider(config.service);
        // 凭据统一在「系统设置 → 服务商凭据」里按服务商维护，这里只确认配了没有 ——
        // 密钥不在这一页，也就不该在这一页被判「太短」「不能为空」。
        // callback 例外：它的凭据就是每个域名各自的回调地址，仍然填在行里。
        if (config.service === "callback") {
          if (p.idLabel) {
            const key = String(config.access_key || "");
            if (!key)
              return [label, labelOf(config.service, "id") + " 不能为空", "access_key"];
            if (key.length < 6)
              return [
                label,
                labelOf(config.service, "id") + " 长度不能少于 6 位",
                "access_key",
              ];
          }
          // 自定义回调的 RequestBody 是可选填项
          if (p.secretLabel) {
            const secret = String(config.access_secret || "");
            if (!secret)
              return [
                label,
                labelOf(config.service, "secret") + " 不能为空",
                "access_secret",
              ];
            if (secret.length < 10)
              return [
                label,
                labelOf(config.service, "secret") + " 长度不能少于 10 位",
                "access_secret",
              ];
          }
        } else if (!credentialConfigured(config.service)) {
          return [
            label,
            `「${p.name || config.service}」还没有凭据，请先到 系统设置 → 服务商凭据 添加`,
            "service",
          ];
        }
        // 空的源站行不参与校验 —— 用户可能刚点完「添加源站」还没填，
        // 提交时这类行会被丢掉（原页面也是这么过滤的）
        const used = (config.sources || []).filter((s) =>
          String(s.value || "").trim(),
        );
        if (!used.length) return [label, "至少要配一个源站", "sources"];
        const cap = maxSources(config);
        if (used.length > cap)
          return [
            label,
            `${p.name} ${config.cdn_type} 类型最多支持 ${cap} 个源站`,
            "sources",
          ];
        for (let i = 0; i < used.length; i++) {
          const issue = sourceError(config, used[i], i);
          if (issue) return [label, issue[1], "sources"];
        }
        return null;
      }

      /* ---------------- 渲染 ---------------- */
      function countCell(config) {
        const used = (config.sources || []).filter((s) =>
          String(s.value || "").trim(),
        ).length;
        const cap = maxSources(config);
        if (cap === Infinity)
          return `<span class="dnet-cell"><span class="num">${used}</span></span>`;
        return `<span class="dnet-cell"><span class="num">${used}</span><span> / ${cap}</span></span>`;
      }

      function sourceValueCell(source) {
        const family = ifaceFamily(source.type);
        if (family) {
          const list = IFACES[family];
          if (!list.length)
            return `<div class="cell-value"><select data-rk="value" lay-ignore disabled aria-label="网卡"><option value="">未检测到 ${family.toUpperCase()} 网卡</option></select></div>`;
          return `<div class="cell-value"><select data-rk="value" lay-ignore aria-label="网卡">${options(
            list.map((i) => [i.value, i.label]),
            source.value,
          )}</select></div>`;
        }
        return `<div class="cell-value"><input data-rk="value" aria-label="源站值" placeholder="${esc(
          SOURCE_HINT[source.type] || "源站值",
        )}" value="${esc(source.value)}"></div>`;
      }

      // 子表里的下拉一律带 lay-ignore：layui 会把没标记的 <select> 换成它自己的
      // .layui-form-select（原 select 被 display:none），那个多出来的 div 同样是
      // 子网格的网格项，会把后面几列整排挤到下一行去。
      function sourceRow(config, source, index) {
        const rule = portRules(config, source);
        const regexOn = needsRegex(source);
        return `
          <div class="dnet-sub-row" data-idx="${index}">
            <select data-rk="type" lay-ignore aria-label="源站类型">${options(
              SOURCE_TYPES,
              source.type,
            )}</select>
            ${sourceValueCell(source)}
            <select data-rk="priority" lay-ignore aria-label="优先级">${options(
              PRIORITIES,
              source.priority,
            )}</select>
            <input data-rk="weight" inputmode="numeric" aria-label="权重" value="${esc(source.weight)}">
            <select data-rk="protocol" lay-ignore aria-label="协议">${options(
              PROTOCOLS,
              source.protocol,
            )}</select>
            <input data-rk="port" inputmode="numeric" aria-label="HTTP 端口" value="${esc(source.port)}"${rule.http ? "" : " disabled"}>
            <input data-rk="https_port" inputmode="numeric" aria-label="HTTPS 端口" value="${esc(source.https_port)}"${rule.https ? "" : " disabled"}>
            <input data-rk="regex" aria-label="IPv6 正则" placeholder="留空则不启用" value="${esc(source.regex)}"${regexOn ? "" : " disabled"}>
            <button type="button" class="dnet-sub-del" data-del-src aria-label="删除该源站" title="删除该源站">${ICON_CROSS}</button>
          </div>`;
      }

      function sourcesBlock(config) {
        const sources = config.sources || [];
        const body = sources.length
          ? sources.map((s, i) => sourceRow(config, s, i)).join("")
          : '<p class="note">还没有源站，点右上角「添加源站」。</p>';
        const tip = protocolTip(config);
        return `
            <div class="dnet-sub src" data-src-block>
              <div class="dnet-sub-head">
                <span class="t">源站</span>
                <span class="act"><button type="button" class="dnet-sub-add" data-add-src>+ 添加源站</button></span>
              </div>
              <div class="dnet-sub-scroll">
                <div class="dnet-sub-grid">
                  <div class="dnet-sub-head-row">
                    <span>源站类型</span>
                    <span>源站值</span>
                    <span>优先级</span>
                    <span>权重</span>
                    <span>协议</span>
                    <span>HTTP 端口</span>
                    <span>HTTPS 端口</span>
                    <span>IPv6 正则</span>
                    <span></span>
                  </div>
                  <div class="dnet-sub-list" data-src-list>${body}</div>
                </div>
              </div>
              <p class="note" data-proto-tip${tip ? "" : " hidden"}>${tip}</p>
            </div>`;
      }

      // 原页面只有一句静态占位（「CNAME 记录值将在此显示」），并且对 cloudflare
      // 直接跳过轮询。这里把「为什么是空的」说清楚：cloudflare 是后端不会去取，
      // 其它服务商是保存后才算得出来。
      function cnamePlaceholder(config) {
        return config.service === "cloudflare"
          ? "该服务商无需获取 CNAME"
          : "保存后自动获取";
      }

      // 凭据统一在「系统设置 → 服务商凭据」里按服务商配一次，域名行不再各填一份 ——
      // 同一个账号配十个域名就填了十遍，换密钥还得逐个改。这里只报告状态。
      // 唯一例外是 callback：它的「凭据」其实是每个域名各自的回调地址，没法共用。
      function credentialBlock(config) {
        if (config.service === "callback") {
          return `<div data-cred-block>
              <div class="f" data-when="id">
                <label>${esc(labelOf(config.service, "id") || "Callback URL")}</label>
                <input data-key="access_key" autocomplete="off" value="${esc(config.access_key)}">
              </div>
              <div class="f" data-when="secret">
                <label>${esc(labelOf(config.service, "secret") || "请求内容")}</label>
                <input data-key="access_secret" autocomplete="off" value="${esc(config.access_secret)}">
              </div>
            </div>`;
        }
        const p = provider(config.service);
        const name = (p && p.name) || config.service || "该服务商";
        const ready = credentialConfigured(config.service);
        return `<div data-cred-block>
              <div class="f wide">
                <label>凭据</label>
                <span class="tip-line">${
                  ready
                    ? `<span class="dnet-cred ok">已使用系统设置里 ${esc(name)} 的凭据</span>`
                    : `<span class="dnet-cred warn">${esc(name)} 还没有配凭据</span>，请先到 <a href="/settings" target="_blank">系统设置 → 服务商凭据</a> 添加`
                }</span>
              </div>
            </div>`;
      }

      function rowNode(config) {
        const el = document.createElement("div");
        el.className = "dnet-rule";
        el.dataset.id = config.id;
        const open = expanded.has(config.id);
        const p = provider(config.service);
        const tip = [
          helpHtml(config),
          typeHelpHtml(config) ? "类型请参考：" + typeHelpHtml(config) : "",
        ]
          .filter(Boolean)
          .join("<br>");
        el.innerHTML = `
            <div class="dnet-rule-main">
              <button type="button" class="dnet-rule-exp" aria-expanded="${open}" aria-label="展开高级设置" title="高级设置">${ICON_CHEV}</button>
              <input data-key="domain" aria-label="域名" placeholder="cdn.example.com" value="${esc(config.domain)}">
              <select data-key="service" lay-ignore aria-label="CDN 服务商">${options(providerList(), config.service)}</select>
              <select data-key="cdn_type" lay-ignore aria-label="类型">${options(typeList(config.service), config.cdn_type)}</select>
              ${countCell(config)}
              <input data-key="name" aria-label="备注" placeholder="主站加速" value="${esc(config.name)}">
              <button type="button" class="dnet-rule-del" aria-label="删除该行" title="删除该行">${ICON_CROSS}</button>
            </div>
            <div class="dnet-rule-adv"${open ? "" : " hidden"}>
              ${credentialBlock(config)}
              <div class="f wide" data-when="cname">
                <label>CNAME</label>
                <div class="dnet-cname">
                  <span class="v${config.cname ? "" : " is-empty"}" data-cname>${esc(config.cname || cnamePlaceholder(config))}</span>
                  <button type="button" class="dnet-sub-add" data-copy-cname>复制</button>
                </div>
              </div>
              <div class="f wide">
                <label></label>
                <span class="tip-line" data-tip>${tip}</span>
              </div>
              ${sourcesBlock(config)}
              <p class="note">
                源头地址变化时 DCDN 会把新 IP 推到服务商。「网卡获取」只读所选网卡上的地址，静态地址不会被自动更新；IPv6
                还能再给一条匹配正则，用 @1 / @2 取第几个地址。
              </p>
            </div>`;
        return el;
      }

      function renderRows() {
        root.replaceChildren(...configs.map((c) => rowNode(c)));
        for (const el of root.children) {
          const config = configs.find((c) => c.id === el.dataset.id);
          if (config) syncSubRows(el, config);
        }
        form.render("checkbox");
      }
      function renderStat() {
        let sources = 0,
          dynamic = 0;
        for (const config of configs) {
          for (const source of config.sources || []) {
            if (!String(source.value || "").trim()) continue;
            sources++;
            if (String(source.type).startsWith("dynamic_")) dynamic++;
          }
        }
        const vendors = new Set(configs.map((c) => c.service)).size;
        document.querySelector("#kpi-cdns").textContent = configs.length + " 个";
        document.querySelector("#kpi-sources").textContent = sources + " 个";
        document.querySelector("#kpi-dynamic").textContent = dynamic + " 个";
        document.querySelector("#kpi-vendor").textContent = vendors + " 家";
        stat.classList.toggle("is-off", !enabled);
      }
      function renderAll() {
        document.querySelector("#dcdn_enable").checked = enabled;
        renderRows();
        renderStat();
        document.querySelector("#dirty").textContent = dirty
          ? "（有未提交的更改）"
          : "";
        controls(busy || !loaded);
      }
      function controls(disabled) {
        for (const node of document.querySelectorAll("button,input,select"))
          node.disabled = disabled;
        if (!disabled)
          for (const el of root.children) {
            const config = configs.find((c) => c.id === el.dataset.id);
            if (config) syncSubRows(el, config);
          }
        form.render("checkbox");
      }
      // controls() 会无差别放开所有控件，必须再按状态收一遍：端口的可用性由协议
      // 和服务商/类型共同决定、正则只对「网卡获取 IPv6」有意义、网卡下拉在本地没
      // 那块网卡时不该能点。顺便把「值」跟下拉对齐 —— 模型里的网卡名若不在选项里
      // （新建行是空串、或原来选的网卡已不存在），浏览器会自动选中第一项，看着填
      // 好了，一保存却报「值不能为空」。
      function syncSubRows(el, config) {
        const block = el.querySelector("[data-src-block]");
        if (!block) return;
        (config.sources || []).forEach((source, index) => {
          const row = block.querySelector(`.dnet-sub-row[data-idx="${index}"]`);
          if (!row) return;
          const rule = portRules(config, source);
          const port = row.querySelector('[data-rk="port"]');
          if (port) port.disabled = !rule.http;
          const httpsPort = row.querySelector('[data-rk="https_port"]');
          if (httpsPort) httpsPort.disabled = !rule.https;
          const regex = row.querySelector('[data-rk="regex"]');
          if (regex) regex.disabled = !needsRegex(source);
          const family = ifaceFamily(source.type);
          const value = row.querySelector('[data-rk="value"]');
          if (family && value && value.tagName === "SELECT") {
            if (value.options.length && value.value !== source.value)
              source.value = value.value;
            if (!IFACES[family].length) value.disabled = true;
          }
        });
      }
      function renderRow(oldNode, config) {
        const next = rowNode(config);
        oldNode.replaceWith(next);
        syncSubRows(next, config);
        form.render("checkbox");
        return next;
      }
      function refreshCount(row, config) {
        const cell = row.querySelector(".dnet-cell");
        if (cell) cell.outerHTML = countCell(config);
      }
      function refreshSources(outer, config) {
        const block = outer.querySelector("[data-src-block]");
        if (!block) return;
        const scrollLeft = block.querySelector(".dnet-sub-scroll")?.scrollLeft || 0;
        block.outerHTML = sourcesBlock(config);
        const next = outer.querySelector("[data-src-block]");
        const scroller = next?.querySelector(".dnet-sub-scroll");
        if (scroller) scroller.scrollLeft = scrollLeft;
        refreshCount(outer, config);
        renderStat();
      }
      function refreshCname(id) {
        const config = configs.find((c) => c.id === id);
        const box = rowEl(id)?.querySelector("[data-cname]");
        if (!config || !box) return;
        box.textContent = config.cname || cnamePlaceholder(config);
        box.classList.toggle("is-empty", !config.cname);
      }

      /* ---------------- 数据结构 ---------------- */
      function sourceDefaults(first) {
        return {
          type: "domain",
          value: "",
          regex: "",
          // 主站通常只有一个，第 2 条起给「备站」—— 旧页面克隆时会把主站也复制过去，
          // 于是出现两条「主站」
          priority: first ? "main" : "backup",
          weight: "10",
          port: "80",
          https_port: "443",
          protocol: "HTTP",
        };
      }
      function newConfig() {
        const bytes = new Uint8Array(16);
        crypto.getRandomValues(bytes);
        return {
          id: Array.from(bytes, (x) => x.toString(16).padStart(2, "0")).join(""),
          name: "",
          domain: "",
          service: FIRST_PROVIDER,
          access_key: "",
          access_secret: "",
          cdn_type: FIRST_TYPE,
          sources: [sourceDefaults(true)],
          cname: "",
        };
      }
      // 源站类型一变，「值」的语义就全变了（域名 / IP / URL / 命令 / 网卡名）：
      // 网卡获取自动填第一块网卡，两种「接口获取」在为空时补上默认接口清单
      // （旧页面就是这么做的），其余一律清空 —— 把上一格的字符串顺手带过去提交，
      // 比清空危险得多。正则只在「网卡获取 IPv6」下有意义，其它类型清掉。
      function resetSourceValue(source) {
        source.regex = needsRegex(source) ? source.regex : "";
        if (ifaceFamily(source.type)) {
          source.value = firstIfaceValue(source.type);
          return;
        }
        if (source.type === "dynamic_ipv4_url") {
          if (!source.value) source.value = DEFAULT_IPV4_URL;
          return;
        }
        if (source.type === "dynamic_ipv6_url") {
          if (!source.value) source.value = DEFAULT_IPV6_URL;
          return;
        }
        source.value = "";
      }

      /* ---------------- 交互 ---------------- */
      function readConfigField(input) {
        const row = input.closest(".dnet-rule");
        const config = row && configs.find((c) => c.id === row.dataset.id);
        if (!config) return null;
        config[input.dataset.key] = input.value;
        markDirty();
        return { config, key: input.dataset.key, row };
      }
      function readSourceField(input) {
        const sub = input.closest(".dnet-sub-row");
        const outer = input.closest(".dnet-rule");
        const config = outer && configs.find((c) => c.id === outer.dataset.id);
        if (!sub || !config) return null;
        const source = (config.sources || [])[Number(sub.dataset.idx)];
        if (!source) return null;
        source[input.dataset.rk] = input.value;
        markDirty();
        return { config, source, outer };
      }
      // 服务商/类型一换，源站数上限可能变小 —— 直接砍掉超出部分并告诉用户，
      // 别留一个要到保存时才报错的状态
      function trimSources(config) {
        const cap = maxSources(config);
        const sources = config.sources || [];
        if (sources.length <= cap) return;
        config.sources = sources.slice(0, cap);
        const p = provider(config.service);
        layer.msg(
          `${p ? p.name : config.service} ${config.cdn_type} 类型最多支持 ${cap} 个源站，已自动保留前 ${cap} 个`,
          { icon: 0, time: 3000 },
        );
      }
      function addSource(outer, config) {
        const sources = config.sources || (config.sources = []);
        const cap = maxSources(config);
        if (sources.length >= cap) {
          const p = provider(config.service);
          layer.msg(
            `${p ? p.name : config.service} ${config.cdn_type} 类型最多支持 ${cap} 个源站`,
            { icon: 0, time: 2500 },
          );
          return;
        }
        sources.push(sourceDefaults(sources.length === 0));
        markDirty();
        // 新行如果是「网卡获取」之外的默认类型，值还是空的 —— 保持空让占位提示说话
        refreshSources(outer, config);
      }
      function removeSource(outer, config, index) {
        (config.sources || []).splice(index, 1);
        markDirty();
        refreshSources(outer, config);
      }
      async function copyCname(id) {
        const config = configs.find((c) => c.id === id);
        if (!config || !config.cname) {
          layer.msg("CNAME 记录为空，无法复制", { icon: 0, time: 2000 });
          return;
        }
        try {
          await navigator.clipboard.writeText(config.cname);
          layer.msg("CNAME 已复制到剪贴板", { icon: 1, time: 1500 });
        } catch {
          // 非安全上下文 / 旧浏览器没有 Clipboard API，退回 textarea + execCommand
          const area = document.createElement("textarea");
          area.value = config.cname;
          document.body.appendChild(area);
          area.select();
          let ok = false;
          try {
            ok = document.execCommand("copy");
          } catch {
            ok = false;
          }
          area.remove();
          layer.msg(ok ? "CNAME 已复制到剪贴板" : "复制失败，请手动复制", {
            icon: ok ? 1 : 2,
            time: 2000,
          });
        }
      }
      function addRow() {
        if (!loaded || busy) return;
        if (configs.length >= 64) {
          error(Error("最多支持 64 个域名配置"));
          return;
        }
        const config = newConfig();
        configs.push(config);
        markDirty();
        renderRows();
        renderStat();
        const el = rowEl(config.id);
        if (el) {
          el.scrollIntoView({ block: "nearest", behavior: "smooth" });
          el.querySelector('[data-key="domain"]')?.focus({ preventScroll: true });
        }
      }
      async function removeRow(config) {
        if (!loaded || busy) return;
        if (configs.length <= 1) {
          layer.msg("至少保留一行，可关闭全局开关停用");
          return;
        }
        const confirmed = await confirmBox(
          `确定删除「${config.name || config.domain || "未命名"}」？保存后生效。`,
          "删除配置",
        );
        if (!confirmed) return;
        configs.splice(
          configs.findIndex((c) => c.id === config.id),
          1,
        );
        expanded.delete(config.id);
        markDirty();
        renderRows();
        renderStat();
      }
      function restore(data) {
        enabled = !!data.dcdn_enable;
        configs = clone(data.dcdn || []);
        for (const config of configs) {
          if (!Array.isArray(config.sources)) config.sources = [];
          if (config.name === undefined || config.name === null) config.name = "";
          if (!config.access_key) config.access_key = "";
          if (!config.access_secret) config.access_secret = "";
          if (!config.cname) config.cname = "";
          // 类型可能在服务商的 typeSelect 里不存在（配置被手改过），回退到第一个
          if (!typeList(config.service).some((t) => t[0] === config.cdn_type))
            config.cdn_type = firstTypeOf(config.service);
          for (const source of config.sources) {
            if (!SOURCE_TYPES.some((t) => t[0] === source.type))
              source.type = "domain";
            if (!PRIORITIES.some((p) => p[0] === source.priority))
              source.priority = "main";
            if (!PROTOCOLS.some((p) => p[0] === source.protocol))
              source.protocol = "HTTP";
            if (source.value === undefined || source.value === null)
              source.value = "";
            if (source.regex === undefined || source.regex === null)
              source.regex = "";
            if (!source.weight && source.weight !== 0) source.weight = "10";
            if (!source.port) source.port = "80";
            if (!source.https_port) source.https_port = "443";
          }
        }
        if (!configs.length) configs.push(newConfig());
        dirty = false;
        renderAll();
        // saved 存的是「归一化之后」的状态，复位时直接回到这里
        saved = clone({ dcdn_enable: enabled, dcdn: configs });
      }
      async function reload() {
        if (busy || !loaded) return;
        if (dirty) {
          const confirmed = await confirmBox(
            "放弃所有未提交的更改，从服务端重新载入配置？",
            "重载配置",
          );
          if (!confirmed) return;
        }
        try {
          restore(await fetchConfig());
          layer.msg("已重载", { icon: 1, time: 1000 });
        } catch (e) {
          error(e);
        }
      }
      function revealIssue(config, issue) {
        const [label, text, field] = issue;
        const row = rowEl(config.id);
        if (row) {
          row.scrollIntoView({ block: "center", behavior: "smooth" });
          const adv = row.querySelector(".dnet-rule-adv");
          if (adv.hidden) {
            adv.hidden = false;
            row.querySelector(".dnet-rule-exp")?.setAttribute("aria-expanded", "true");
            expanded.add(config.id);
          }
          const input = field ? row.querySelector(`[data-key="${field}"]`) : null;
          if (input) input.focus({ preventScroll: true });
        }
        layer.msg(`${label}：${text}`, { icon: 2, time: 3000 });
      }
      async function submit() {
        if (busy || !loaded) return;
        for (const config of configs) {
          const issue = configError(config);
          if (!issue) continue;
          revealIssue(config, issue);
          return;
        }
        busy = true;
        controls(true);
        try {
          // 空的源站行允许存在（刚点完「添加源站」还没填），提交时按原页面的做法
          // 过滤掉：只带真正有值的源站，整条没有任何源站的配置也一并去掉
          const used = (config) =>
            (config.sources || []).filter((s) => String(s.value || "").trim());
          const payload = {
            dcdn_enable: enabled,
            dcdn: configs
              .filter((c) => String(c.domain || "").trim() && used(c).length)
              .map((c) => ({ ...c, sources: used(c) })),
          };
          const data = await saveConfig(payload);
          dirty = false;
          // POST /dcdn 只回一句 msg，data 是 null —— 本地状态自己留好
          if (data) restore(data);
          else renderAll();
          saved = clone({ dcdn_enable: enabled, dcdn: configs });
          // 还得去服务端取 CNAME 的话就别说「已全部完成」，跟原页面一致
          layer.msg(
            pendingCname().length ? "配置保存成功，正在获取 CNAME..." : "配置保存成功",
            { icon: 1, time: pendingCname().length ? 2000 : 1200 },
          );
          startCnamePolling();
        } catch (e) {
          error(e);
        } finally {
          busy = false;
          controls(false);
        }
      }
      async function reset() {
        if (!saved || busy) return;
        if (!dirty) {
          restore(saved);
          return;
        }
        const confirmed = await confirmBox(
          "放弃所有未提交的更改，恢复到上次提交状态？",
          "复位配置",
        );
        if (confirmed) restore(saved);
      }

      /* ---------------- CNAME 轮询 ----------------
         保存后服务端要花几秒去云商建/查结果，CNAME 是算出来回填的。旧页面只轮询
         「当前选中的那条」，行列表里所有行都摊在眼前，所以改成一轮里把所有行的
         CNAME 一起刷新，全部到位或超时再停。 */
      const CNAME_MAX_TICKS = 30,
        CNAME_INTERVAL = 2000;
      let cnameTimer = null,
        cnameTicks = 0;
      function pendingCname() {
        return configs.filter((c) => c.service !== "cloudflare" && !c.cname);
      }
      function stopCnamePolling() {
        if (cnameTimer) {
          clearTimeout(cnameTimer);
          cnameTimer = null;
        }
        cnameTicks = 0;
      }
      function startCnamePolling() {
        stopCnamePolling();
        if (!pendingCname().length) return;
        cnameTicks = 0;
        checkCname();
      }
      async function checkCname() {
        cnameTicks++;
        if (cnameTicks > CNAME_MAX_TICKS) {
          stopCnamePolling();
          layer.msg("CNAME 获取超时，请稍后刷新页面查看", { icon: 0, time: 3000 });
          return;
        }
        try {
          const remote = await fetchConfig();
          let got = "";
          for (const config of configs) {
            const hit = (remote.dcdn || []).find((r) => r.id === config.id);
            if (hit && hit.cname && hit.cname !== config.cname) {
              config.cname = hit.cname;
              refreshCname(config.id);
              if (!got) got = config.cname;
            }
          }
          if (got) layer.msg("CNAME 已获取：" + got, { icon: 1, time: 2500 });
          if (!pendingCname().length) {
            stopCnamePolling();
            return;
          }
          cnameTimer = setTimeout(checkCname, CNAME_INTERVAL);
        } catch (e) {
          stopCnamePolling();
          layer.msg("获取配置失败，请手动刷新页面", { icon: 2, time: 2000 });
        }
      }

      root.addEventListener("input", (e) => {
        const target = e.target;
        if (
          target.dataset.key === "domain" ||
          target.dataset.key === "name" ||
          target.dataset.key === "access_key" ||
          target.dataset.key === "access_secret"
        ) {
          readConfigField(target);
          return;
        }
        if (
          target.dataset.rk === "value" ||
          target.dataset.rk === "weight" ||
          target.dataset.rk === "port" ||
          target.dataset.rk === "https_port" ||
          target.dataset.rk === "regex"
        )
          readSourceField(target);
      });
      root.addEventListener("change", (e) => {
        const target = e.target;
        if (target.dataset.key === "service" || target.dataset.key === "cdn_type") {
          const hit = readConfigField(target);
          if (!hit) return;
          const { config, key, row } = hit;
          if (key === "service") {
            // 换了服务商，类型清单整个换一套；旧类型可能不存在了，回退到第一个
            if (!typeList(config.service).some((t) => t[0] === config.cdn_type))
              config.cdn_type = firstTypeOf(config.service);
          }
          trimSources(config);
          renderRow(row, config);
          renderStat();
          return;
        }
        if (!target.dataset.rk) return;
        const hit = readSourceField(target);
        if (!hit) return;
        const { config, source, outer } = hit;
        if (target.dataset.rk === "type") {
          resetSourceValue(source);
          refreshSources(outer, config);
        } else if (target.dataset.rk === "protocol") {
          // 协议决定哪个端口有意义，端口列的可用性要跟着重画
          refreshSources(outer, config);
        }
        // value / priority：只更新数据，没有联动
      });
      root.addEventListener("click", (e) => {
        const outer = e.target.closest(".dnet-rule");
        if (!outer) return;
        const config = configs.find((c) => c.id === outer.dataset.id);
        if (!config) return;
        if (e.target.closest(".dnet-rule-exp")) {
          const adv = outer.querySelector(".dnet-rule-adv");
          adv.hidden = !adv.hidden;
          outer
            .querySelector(".dnet-rule-exp")
            .setAttribute("aria-expanded", String(!adv.hidden));
          if (adv.hidden) expanded.delete(config.id);
          else expanded.add(config.id);
          return;
        }
        if (e.target.closest(".dnet-rule-del")) {
          removeRow(config);
          return;
        }
        if (e.target.closest("[data-copy-cname]")) {
          copyCname(config.id);
          return;
        }
        if (e.target.closest("[data-add-src]")) {
          addSource(outer, config);
          return;
        }
        if (e.target.closest("[data-del-src]")) {
          const row = e.target.closest(".dnet-sub-row");
          if (row) removeSource(outer, config, Number(row.dataset.idx));
        }
      });

      document.querySelector("#add-row").onclick = addRow;
      document.querySelector("#reload").onclick = reload;
      for (const button of document.querySelectorAll(".reset"))
        button.onclick = reset;

      form.on("submit(save)", function () {
        submit();
        return false;
      });
      form.on("switch(global-enable)", (data) => {
        enabled = data.elem.checked;
        markDirty();
        renderStat();
      });
      window.addEventListener("beforeunload", (e) => {
        if (dirty) {
          e.preventDefault();
          e.returnValue = "";
        }
      });

      // 初始数据全部来自模板注入的 configData，没有可用的裸 JSON 接口给「初始化」用
      // （/api/dcdn/config 是给重载和 CNAME 轮询的，把它当成初始数据源会多一次请求）
      const injected =
        configData && typeof configData === "object"
          ? configData
          : { dcdn_enable: false, dcdn: [] };
      // 哪些 CDN 服务商已经在系统设置里配好凭据（只有 id，没有密钥）
      if (Array.isArray(injected.configured_providers))
        configuredProviders = new Set(injected.configured_providers);
      loaded = true;
      restore(injected);
    });
  </script>
</html>
