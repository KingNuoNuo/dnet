# D-NET 内置精简规则集，由 Coraza 解析。
#
# 这里只保留覆盖面广、误报低的请求侧检测（请求行、请求头、请求体）。
# 不检查响应体：反向代理需要保留流式转发和 WebSocket 升级。
# 修改本文件后需重新编译，规则在进程内只解析一次并被所有服务共享。

SecRuleEngine On
# block 动作沿用这里的默认处置：命中即拒绝并返回 403。
SecDefaultAction "phase:1,log,auditlog,deny,status:403"
SecDefaultAction "phase:2,log,auditlog,deny,status:403"
SecRequestBodyAccess On
# 只检查请求体前 1 MiB，超出的部分继续原样转发给后端，避免大文件上传被截断。
SecRequestBodyLimit 1048576
SecRequestBodyLimitAction ProcessPartial
SecRequestBodyInMemoryLimit 1048576
SecResponseBodyAccess Off

# 让 JSON / XML 请求体也进入 ARGS，否则接口类请求的正文规则形同虚设；
# 完全没写 Content-Type 的表单按 urlencoded 解析（与后端常见默认行为一致）。
SecRule REQUEST_HEADERS:Content-Type "@rx ^application/json" "id:900001,phase:1,pass,nolog,ctl:requestBodyProcessor=JSON"
SecRule REQUEST_HEADERS:Content-Type "@rx ^(?:application|text)/xml" "id:900002,phase:1,pass,nolog,ctl:requestBodyProcessor=XML"
SecRule &REQUEST_HEADERS:Content-Type "@eq 0" "id:900003,phase:1,pass,nolog,ctl:requestBodyProcessor=URLENCODED"

# 900100 挡掉 TRACE / TRACK（XST），WebDAV 的 PROPFIND 等方法保持可用。
SecRule REQUEST_METHOD "@rx ^(?:TRACE|TRACK)$" "id:900100,phase:1,block,log,t:none,msg:'不支持的请求方法',tag:'protocol',severity:'WARNING'"

# 900110 SQL 注入：联合查询、恒真条件、危险函数与元数据探测。
SecRule REQUEST_COOKIES|REQUEST_COOKIES_NAMES|REQUEST_HEADERS|ARGS|ARGS_NAMES|XML:/* "@rx (?:\bunion\s+(?:all\s+)?select\s|(?:'|\"|\))\s*(?:or|and)\s+(?:'[^']*'|\d+)\s*=|\bselect\s+(?:\*|[\w`\"\[\].]+\s*,\s*[\w`\"\[\].]+(?:\s*,\s*[\w`\"\[\].]+)*)\s+from\b|\binsert\s+into\b|\bupdate\s+[a-z0-9_`\"\[\].]+\s+set\b|\bdelete\s+from\b|\bdrop\s+(?:table|database|index)\b|\btruncate\s+table\b|\binformation_schema\b|\b(?:sleep|benchmark|pg_sleep|waitfor\s+delay)\s*\(|\binto\s+(?:out|dump)file\b|\bload_file\s*\(|\bextractvalue\s*\(|\bupdatexml\s*\()" "id:900110,phase:2,block,log,t:none,t:urlDecodeUni,t:lowercase,msg:'疑似 SQL 注入',tag:'attack-sqli',severity:'CRITICAL'"

# 900120 跨站脚本：标签、事件处理器、伪协议与常见 DOM 入口。
SecRule REQUEST_COOKIES|REQUEST_COOKIES_NAMES|REQUEST_HEADERS|ARGS|ARGS_NAMES|XML:/* "@rx (?:<script|javascript\s*:|vbscript\s*:|\bon(?:error|load|click|mouseover|focus|submit|animationstart)\s*=|<(?:iframe|object|embed|svg|math)\b|document\.(?:cookie|domain|location)|window\.location|(?:alert|prompt|confirm|eval)\s*\(|string\.fromcharcode)" "id:900120,phase:2,block,log,t:none,t:urlDecodeUni,t:lowercase,msg:'疑似 XSS 跨站脚本',tag:'attack-xss',severity:'CRITICAL'"

# 900130 路径穿越与敏感文件探测。
SecRule REQUEST_URI|REQUEST_FILENAME|ARGS "@rx (?:\.\./|\.\.\\|%2e%2e(?:%2f|%5c)|/etc/(?:passwd|shadow|hosts)|[a-z]:\\windows\\system32|/proc/self/environ|/\.(?:git|svn|hg|env|aws|ssh)(?:/|\b)|wp-config\.php|/phpinfo\.php)" "id:900130,phase:1,block,log,t:none,t:urlDecodeUni,t:lowercase,msg:'疑似路径穿越或敏感文件探测',tag:'attack-lfi',severity:'CRITICAL'"

# 900140 命令注入：常见命令拼接与命令替换（命令后必须是空白、路径分隔符或结束，
# 避免把 &id=1 这类普通查询参数当成注入）。
SecRule REQUEST_COOKIES|REQUEST_COOKIES_NAMES|REQUEST_HEADERS|ARGS|ARGS_NAMES|XML:/* "@rx (?:[;&|]\s*(?:cat|ls|whoami|id|uname|curl|wget|nc|netcat|bash|sh|python|perl|powershell|cmd)(?:\s|$|/|;|&|\|)|\$\(|\|\s*(?:nc|bash|sh)(?:\s|$))" "id:900140,phase:2,block,log,t:none,t:urlDecodeUni,t:lowercase,msg:'疑似命令注入',tag:'attack-rce',severity:'CRITICAL'"

# 900150 WebShell / 代码执行特征。
SecRule REQUEST_BODY "@rx (?:<\?php|base64_decode\s*\(|shell_exec\s*\(|passthru\s*\(|proc_open\s*\(|assert\s*\()" "id:900150,phase:2,block,log,t:none,t:urlDecodeUni,t:lowercase,msg:'疑似 WebShell 或代码执行',tag:'attack-rce',severity:'CRITICAL'"

# 900160 自动化扫描器 UA。
SecRule REQUEST_HEADERS:User-Agent "@rx (?:sqlmap|nikto|nmap|masscan|zgrab|acunetix|nessus|openvas|dirbuster|gobuster|wpscan|joomscan|wfuzz|hydra|nuclei)" "id:900160,phase:1,block,log,t:none,t:lowercase,msg:'自动化扫描器',tag:'scanner',severity:'WARNING'"
